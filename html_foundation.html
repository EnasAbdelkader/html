<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Foundations — Interactive Explainer</title>
<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<script>
  /* Set theme before paint to avoid a flash of the wrong theme */
  (function(){
    try{
      var pref = localStorage.getItem('htmlfoundations.theme.v1') || 'system';
      var dark = pref==='dark' || (pref==='system' && matchMedia('(prefers-color-scheme:dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    }catch(e){}
  })();
</script>
<style>
  :root{
    --text:#2C2C2B; --text2:#666159; --canvas:#FFFDF5; --soft:#FFF8E1;
    --surface:#F4EDE0; --border:#E6DBB8; --blue:#3A86FF; --blue-soft:#EEF4FF;
    --green:#2CD182; --green-soft:#E6FFF4; --orange:#FF006E; --orange-soft:#FFE6F1;
    --yellow:#FFBE0B; --yellow-soft:#FFF8DC;
    --red:#FF4A4A; --red-soft:#FFEAEA;
    --mono:"Menlo","Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --fun:"Comic Neue","Chalkboard SE","Comic Sans MS","Trebuchet MS",var(--sans);
    --shadow:0 6px 0 rgba(230, 219, 184, 0.6), 0 8px 24px rgba(0,0,0,.04);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--fun);color:var(--text);background:var(--canvas);font-size:18px;line-height:1.6}
  a{color:var(--blue);text-decoration:none;font-weight:bold}
  code,kbd{font-family:var(--mono);font-size:.9em;background:var(--surface);padding:2px 6px;border-radius:6px}

  /* Layout */
  .app{display:flex;min-height:100vh;position:relative;z-index:1}
  .sidebar{width:290px;flex-shrink:0;background:var(--soft);border-right:3px solid var(--border);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 16px;box-shadow:4px 0 0 rgba(0,0,0,0.02)}
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px 8px;margin-bottom:12px}
  .brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg, var(--blue), var(--orange));color:#fff;
    display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,0.15)}
  .brand h1{font-size:18px;line-height:1.2;font-family:var(--fun);font-weight:800;color:var(--text)}
  .brand p{font-size:13px;color:var(--text2);font-weight:600}
  
  .progress-wrap{padding:8px;margin-bottom:12px;background:var(--canvas);border:2px solid var(--border);border-radius:14px}
  .progress-bar{height:12px;border-radius:8px;background:var(--surface);overflow:hidden}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg, var(--green), #5be4a9);border-radius:8px;transition:width .4s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
  .progress-label{font-size:13px;color:var(--text2);margin-top:6px;font-weight:700;text-align:center}
  
  nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--text);
    font-size:15px;margin-bottom:4px;transition:all .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);font-weight:700}
  nav a .nx{width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--text2);
    display:grid;place-items:center;font-size:15px;flex-shrink:0;border:2px solid var(--border);box-shadow:0 2px 0 var(--border)}
  nav a:hover{background:var(--surface);transform:translateX(4px) scale(1.02)}
  nav a.active{background:var(--blue-soft);color(--blue);box-shadow:0 4px 0 var(--blue);border:2px solid var(--blue);transform:translateX(4px)}
  nav a.active .nx{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 0 #1B65DB}
  nav a.done .nx{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 0 #198F53}
  .navsec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);
    padding:16px 12px 6px;font-weight:800;font-family:var(--fun)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .content{max-width:820px;width:100%;margin:0 auto;padding:48px 32px 96px}

  /* Typography */
  h2.title{font-size:38px;line-height:1.2;font-weight:900;margin-bottom:12px;color:var(--text)}
  .lead{font-size:20px;color:var(--text2);margin-bottom:16px;font-weight:600}
  h3{font-size:26px;font-weight:800;margin:38px 0 16px;color:var(--text);border-bottom:3px dashed var(--border);padding-bottom:6px}
  h4{font-size:20px;font-weight:800;margin:24px 0 12px}
  p{margin-bottom:16px}
  ul.doc,ol.doc{margin:0 0 20px 24px}
  ul.doc li,ol.doc li{margin-bottom:8px}
  .kicker{display:inline-block;font-size:13px;font-weight:800;
    color:var(--blue);background:var(--blue-soft);padding:6px 14px;border-radius:20px;margin-bottom:16px;border:2px solid var(--blue)}

  /* Cards & callouts */
  .callout{display:flex;gap:14px;padding:16px 20px;border-radius:var(--radius);margin:22px 0;font-size:16px;border:3px solid var(--border);background:var(--soft);box-shadow:0 4px 0 var(--border)}
  .callout .ic{font-size:24px;line-height:1.2;display:flex;align-items:center}
  .callout.tip{background:var(--green-soft);border-color:var(--green);box-shadow:0 4px 0 var(--green);color:#135f35}
  .callout.tip .ic{color:var(--green)}
  .callout.warn{background:var(--red-soft);border-color:var(--red);box-shadow:0 4px 0 var(--red);color:#721c24}
  .callout.warn .ic{color:var(--red)}
  .callout.note{background:var(--blue-soft);border-color:var(--blue);box-shadow:0 4px 0 var(--blue);color:#1b4b8a}
  .callout.note .ic{color:var(--blue)}

  /* Code block */
  .code{background:#1E1E24;border-radius:var(--radius);overflow:hidden;margin:22px 0;box-shadow:0 8px 24px rgba(0,0,0,0.15);border:3px solid #2A2A35}
  .code-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#2A2A35}
  .code-head .dots{display:flex;gap:8px}
  .code-head .dots i{width:13px;height:13px;border-radius:50%;display:block}
  .code-head .fname{color:#A5A5B5;font-family:var(--mono);font-size:13px;font-weight:bold}
  .code pre{margin:0;padding:18px;overflow-x:auto}
  .code code{color:#F5F5FBC1;font-family:var(--mono);font-size:14px;line-height:1.6;white-space:pre;background:transparent;padding:0}
  .tok-tag{color:#FF6599;font-weight:bold}.tok-attr{color:#2CD182}.tok-str{color:#FFB84D}
  .tok-com{color:#686875;font-style:italic}.tok-txt{color:#E2E2EC}

  /* Live playground */
  .play{border:3px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:26px 0;box-shadow:var(--shadow);background:var(--canvas)}
  .play-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--soft);border-bottom:3px solid var(--border)}
  .play-head .t{font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
  .play-body{display:grid;grid-template-columns:1fr 1fr}
  .play-body textarea{border:0;resize:vertical;min-height:200px;padding:16px;font-family:var(--mono);
    font-size:14px;line-height:1.6;background:#1E1E24;color:#E2E2EC;outline:none}
  .play-body .preview{border-left:3px solid var(--border);background:#fff;min-height:200px}
  .play-body iframe{width:100%;height:100%;min-height:200px;border:0;display:block}
  
  .btn{cursor:pointer;font-family:var(--fun);font-size:14px;font-weight:800;border:3px solid var(--border);
    background:#fff;color:var(--text);padding:8px 18px;border-radius:14px;box-shadow:0 4px 0 var(--border);transition:all .15s;
    display:inline-flex;align-items:center;gap:6px}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--border)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--border)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 0 #1B65DB}
  .btn.primary:hover{box-shadow:0 6px 0 #1B65DB;filter:brightness(1.05)}
  .btn.primary:active{box-shadow:0 2px 0 #1B65DB}

  /* Attribute anatomy diagram */
  .anatomy{background:var(--soft);border:3px dashed var(--border);border-radius:var(--radius);padding:34px 22px 26px;margin:26px 0}
  .ana-el{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:stretch}
  .apart{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;
    padding:18px;border-radius:16px;border:3px solid rgba(0,0,0,0.08);background:var(--canvas);box-shadow:0 6px 0 rgba(0,0,0,0.04);
    animation:anaIn .55s cubic-bezier(.175, .885, .32, 1.275) backwards;animation-delay:calc(var(--d,0)*.18s)}
  .apart .acode{font-family:var(--mono);font-weight:700;font-size:clamp(16px,3.5vw,24px);
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .apart .eq{opacity:.7;margin:0 2px;color:var(--blue)}
  .apart .lbl{font-family:var(--fun);font-size:13px;font-weight:800;background:rgba(0,0,0,0.05);padding:2px 8px;border-radius:8px}
  .apart.tag{background:#E1F0FF;color:#0B5AA8;border-color:#B3D7FF;box-shadow:0 6px 0 #B3D7FF}.apart.tag .lbl{color:#0B5AA8}
  .apart.txt{background:#FFF;color:var(--text);border-color:var(--border);box-shadow:0 6px 0 var(--border)}
  .apart:hover{transform:translateY(-6px) scale(1.03) rotate(1deg);box-shadow:0 12px 20px rgba(0,0,0,0.08)}
  
  .chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;
    border-radius:10px;margin:0 2px;font-weight:800;border:2px dashed rgba(0,0,0,0.15)}
  .chip .clbl{font-family:var(--fun);font-style:normal;font-size:11px;font-weight:800;line-height:1;margin-top:2px}
  .chip.attr{background:#E6FFF4;color:#1B8A4F}.chip.attr .clbl{color:#1B8A4F}
  .chip.val{background:#FFF3E0;color:#B26A00}.chip.val .clbl{color:#B26A00}
  .ana-cap{text-align:center;font-size:16px;line-height:1.6;color:var(--text2);margin:24px auto 0;max-width:580px;font-weight:600}
  @keyframes anaIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}

  /* Quiz */
  .quiz{border:3px solid var(--border);border-radius:var(--radius);padding:24px;margin:26px 0;background:var(--canvas);box-shadow:var(--shadow)}
  .quiz .qtag{font-size:13px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
  .quiz .qtext{font-size:20px;font-weight:800;margin:8px 0 16px;color:var(--text)}
  .quiz .opt{display:block;width:100%;text-align:left;border:3px solid var(--border);background:var(--canvas);
    padding:14px 16px;border-radius:16px;margin-bottom:10px;cursor:pointer;font-size:16px;font-family:var(--fun);box-shadow:0 4px 0 var(--border);
    color:var(--text);transition:all .15s;display:flex;gap:12px;align-items:center;font-weight:700}
  .quiz .opt:hover{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 0 var(--blue);transform:translateY(-2px)}
  .quiz .opt:active{transform:translateY(2px);box-shadow:0 0px 0 var(--blue)}
  .quiz .opt .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:var(--soft);flex-shrink:0;
    display:grid;place-items:center;font-size:13px;font-weight:900}
  .quiz .opt.correct{background:var(--green-soft);border-color:var(--green);color:#1B8A4F;box-shadow:0 4px 0 var(--green)}
  .quiz .opt.correct .mk{background:var(--green);border-color:var(--green);color:#fff}
  .quiz .opt.wrong{background:var(--red-soft);border-color:var(--red);color:#B71C1C;box-shadow:0 4px 0 var(--red)}
  .quiz .opt.wrong .mk{background:var(--red);border-color:var(--red);color:#fff}
  .quiz .opt:disabled{cursor:default;transform:none !important;box-shadow:none}
  .quiz .fb{font-size:15px;padding:14px;border-radius:14px;margin-top:12px;display:none;font-weight:700;border:2px solid transparent}
  .quiz .fb.show{display:block;animation:pop .3s ease}
  .quiz .fb.ok{background:var(--green-soft);color:#1B8A4F;border-color:var(--green)}
  .quiz .fb.no{background:var(--red-soft);color:#B71C1C;border-color:var(--red)}

  /* Exercise */
  .exercise{border:3px dashed var(--blue);border-radius:var(--radius);padding:24px;margin:26px 0;background:var(--blue-soft);box-shadow:0 6px 0 #D0E1FF}
  .exercise .etag{font-size:13px;font-weight:900;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:6px}
  .exercise h4{margin:8px 0 8px;font-size:22px;color:var(--text)}
  .exercise .goal{font-size:16px;margin-bottom:12px;font-weight:600}
  .checklist{list-style:none;margin:12px 0 0}
  .checklist li{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:15px;font-weight:700}
  .checklist li .fa-check-star{color:var(--yellow);font-size:14px}

  /* Reference table */
  table.ref{width:100%;border-collapse:collapse;margin:22px 0;font-size:15px;border-radius:14px;overflow:hidden;border:3px solid var(--border);box-shadow:0 4px 0 var(--border)}
  table.ref th,table.ref td{padding:12px 14px;text-align:left;vertical-align:middle}
  table.ref th{background:var(--surface);font-weight:800;color:var(--text);border-bottom:3px solid var(--border)}
  table.ref td{border-bottom:1px solid var(--border);font-weight:600;background:var(--canvas)}
  table.ref tr:nth-child(even) td{background:var(--soft)}

  /* footer nav */
  .pager{display:flex;justify-content:space-between;gap:16px;margin-top:48px;border-top:3px dashed var(--border);padding-top:32px}
  .pager a{flex:1;border:3px solid var(--border);border-radius:16px;padding:16px;background:var(--canvas);box-shadow:0 6px 0 var(--border);transition:all .2s}
  .pager a:hover{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 6px 0 var(--blue);transform:translateY(-2px)}
  .pager a.next{text-align:right}
  .pager .dir{font-size:13px;color:var(--text2);font-weight:800}
  .pager .ttl{font-size:17px;font-weight:900;color:var(--text);margin-top:4px}
  .pager a.disabled{opacity:.3;pointer-events:none;box-shadow:none}

  .page{display:none;animation:fade .3s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  
  .page.active>*{animation:blockIn .5s cubic-bezier(0.175, 0.885, 0.32, 1.15) backwards}
  .page.active>*:nth-child(1){animation-delay:.03s}
  .page.active>*:nth-child(2){animation-delay:.08s}
  .page.active>*:nth-child(3){animation-delay:.13s}
  .page.active>*:nth-child(4){animation-delay:.18s}
  .page.active>*:nth-child(5){animation-delay:.23s}
  @keyframes blockIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .mark-done{display:flex;align-items:center;gap:12px;margin-top:42px;padding:20px;border:3px solid var(--border);border-radius:var(--radius);background:var(--soft);box-shadow:0 4px 0 var(--border)}
  .mark-done span{font-weight:800;font-size:17px}
  .mark-done .btn{margin-left:auto}

  /* mobile */
  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:50;background:#fff;border:3px solid var(--border);
    border-radius:12px;width:48px;height:48px;font-size:24px;cursor:pointer;box-shadow:var(--shadow);place-items:center}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);z-index:40}
  @media(max-width:880px){
    .play-body{grid-template-columns:1fr}
    .play-body .preview{border-left:0;border-top:3px solid var(--border)}
    .menu-btn{display:grid}
    .sidebar{position:fixed;left:0;top:0;z-index:45;transform:translateX(-100%);transition:transform .25s ease-out;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .backdrop.open{display:block}
    .content{padding:80px 20px 80px}
    h2.title{font-size:30px}
  }

  /* Dark theme overrides */
  html[data-theme="dark"]{color-scheme:dark}
  [data-theme="dark"]{--text:#FFF;--text2:rgba(255,255,255,.75);--canvas:#1E1E22;--soft:#292930;
    --surface:#3E3E4A;--border:#4E4E5A;--blue:#6495ED;--blue-soft:rgba(100,149,237,.12);
    --green:#44E599;--green-soft:rgba(68,229,153,.12);--orange:#FF5E97;--orange-soft:rgba(255,94,151,.12);
    --red:#FF6B6B;--red-soft:rgba(255,107,107,.12);--shadow:0 6px 0 #121215,0 8px 24px rgba(0,0,0,.3)}
  [data-theme="dark"] .apart.tag{background:rgba(11,90,168,0.3);color:#99CCFF}
  [data-theme="dark"] .apart.txt{background:var(--soft);color:var(--text)}
  [data-theme="dark"] .chip.attr{background:rgba(44,209,130,0.15);color:#44E599}
  [data-theme="dark"] .chip.val{background:rgba(255,159,28,0.15);color:#FFAF38}
  [data-theme="dark"] table.ref td{background:var(--canvas)}
  [data-theme="dark"] .play-body .preview,[data-theme="dark"] .play-body iframe{background:#fff}

  /* Controls settings */
  .theme-toggle, .lang-toggle{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin:0 8px 12px;border:2px solid var(--border)}
  .theme-toggle button, .lang-toggle button{flex:1;border:0;background:transparent;color:var(--text2);font-family:var(--fun);
    font-size:13px;font-weight:800;padding:8px 4px;border-radius:9px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:5px;transition:all .15s}
  .theme-toggle button.active, .lang-toggle button.active{background:var(--canvas);color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,0.05);border:1px solid var(--border)}

  /* Custom components */
  h2.title{ display:flex; align-items:center; gap:14px; flex-wrap:wrap }
  .tico{ display:inline-grid; place-items:center; width:58px; height:58px; border-radius:18px;
    background:linear-gradient(135deg,var(--blue-soft),var(--yellow-soft)); color:var(--text);
    box-shadow:0 6px 0 var(--border); flex-shrink:0; animation:pop .5s cubic-bezier(.175, .885, .32, 1.35) backwards }

  /* Utilities */
  .copy{ cursor:pointer; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1);
    color:#FFF; font-family:var(--fun); font-size:12px; font-weight:800; padding:4px 12px;
    border-radius:10px; transition:all .15s; display:inline-flex; align-items:center; gap:4px }
  .copy:hover{ background:rgba(255,255,255,.25); transform:translateY(-1px) }
  .copy.ok{ background:var(--green); border-color:var(--green) }
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden }
  .confetti i{ position:absolute; top:-16px; width:12px; height:18px; border-radius:3px; opacity:.95;
    animation:confFall 2.5s cubic-bezier(.25,.6,.5,1) forwards }
  @keyframes confFall{ to{ transform:translateY(106vh) rotate(540deg); opacity:0 } }
  .toast{ position:fixed; left:50%; bottom:38px; transform:translate(-50%,22px); z-index:10000;
    background:linear-gradient(135deg, var(--blue), var(--yellow)); color:#fff; font-family:var(--fun); font-weight:900; font-size:18px;
    padding:14px 28px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.25); opacity:0;
    transition:all .3s cubic-bezier(.175, .885, .32, 1.25); pointer-events:none }
  .toast.show{ opacity:1; transform:translate(-50%,0) }

  /* Background dynamics */
  .bg-anim{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none }
  .bg-anim .blob{ position:absolute; border-radius:50%; filter:blur(80px); opacity:.14; will-change:transform }
  .bg-anim .b1{ width:500px; height:500px; background:var(--blue); top:-100px; left:-100px; animation:drift 20s infinite alternate }
  .bg-anim .b2{ width:400px; height:400px; background:var(--yellow); bottom:-80px; right:-80px; animation:drift 25s infinite alternate-reverse }
  @keyframes drift{ 0%{ transform:translate(0,0) scale(1) } 100%{ transform:translate(60px, 40px) scale(1.15) } }

  .bg-floats{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none }
  .bg-floats .fl{ position:absolute; bottom:-70px; font-family:var(--mono); font-size:26px; font-weight:800;
    opacity:0; animation:floatUp 22s linear infinite }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0 }
    10%{ opacity:.25 }
    90%{ opacity:.25 }
    100%{ transform:translateY(-115vh) rotate(360deg); opacity:0 }
  }

  /* RTL settings */
  [dir="rtl"] body{direction:rtl}
  [dir="rtl"] table.ref th,[dir="rtl"] table.ref td{text-align:right}
  [dir="rtl"] .quiz .opt{text-align:right}
  [dir="rtl"] .pager a.next{text-align:left}
  [dir="rtl"] ul.doc,[dir="rtl"] ol.doc{margin:0 24px 20px 0}
  [dir="rtl"] .mark-done .btn{margin-left:0;margin-right:auto}
  [dir="rtl"] .sidebar{border-right:0;border-left:3px solid var(--border)}

<script>
/* ============ HTML Foundations Engine ============ */
const LANG_KEY='htmlfoundations.lang.v1';
let LANG = localStorage.getItem(LANG_KEY) || 'en';
function t(en, ar){ return LANG==='ar' ? ar : en; }
function pick(o){ return (o && o[LANG]) || o.en; }

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(src){
  let s = esc(src);
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-com">$1</span>');
  s = s.replace(/(&lt;\/?)([a-zA-Z0-9]+)([^]*?)(\/?&gt;)/g, function(m,open,name,attrs,close){
    let a = attrs.replace(/([a-zA-Z-]+)(=)(&quot;.*?&quot;|".*?"|'.*?')/g,
      '<span class="tok-attr">$1</span>=<span class="tok-str">$3</span>');
    return '<span class="tok-tag">'+open+name+'</span>'+a+'<span class="tok-tag">'+close+'</span>';
  });
  return s;
}
function codeBlock(fname, src){
  return `<div class="code" dir="ltr"><div class="code-head"><div class="dots"><i style="background:#FF4A4A"></i><i style="background:#FFBE0B"></i><i style="background:#2CD182"></i></div><div class="chead-r"><span class="fname">${fname||'index.html'}</span><button class="copy" data-copy type="button"><i class="fa-solid fa-copy"></i> ${t('Copy','نسخ')}</button></div></div><pre><code>${hl(src)}</code></pre></div>`;
}
let _pid=0;
function play(code){
  const id='pg'+(_pid++);
  return `<div class="play"><div class="play-head"><span class="t"><i class="fa-solid fa-pen-to-square"></i> ${t('Live editor — try editing the code!','محرر مباشر — جرب تعديل الكود!')}</span><button class="btn primary" data-run="${id}"><i class="fa-solid fa-play"></i> ${t('Run','شغّل')}</button></div><div class="play-body"><textarea id="${id}" spellcheck="false" dir="ltr">${esc(code)}</textarea><div class="preview"><iframe id="${id}-out" title="preview"></iframe></div></div></div>`;
}
let _qid=0;
function quiz(q, opts, correct, why){
  const id='q'+(_qid++);
  const buttons = opts.map((o,i)=>`<button class="opt" data-q="${id}" data-i="${i}"><span class="mk">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('');
  return `<div class="quiz" data-correct="${correct}" data-why="${esc(why)}"><div class="qtag"><i class="fa-solid fa-circle-question"></i> ${t('Quick check','سؤال سريع')}</div><div class="qtext">${q}</div>${buttons}<div class="fb" id="${id}-fb"></div></div>`;
}

function anatomy(){ return `<div class="anatomy" dir="ltr">
  <div class="ana-el">
    <span class="apart tag" style="--d:0">
      <span class="acode">&lt;a <span class="chip attr">href<em class="clbl">${t('attribute','خاصية')}</em></span><span class="eq">=</span><span class="chip val">&quot;index.html&quot;<em class="clbl">${t('value','القيمة')}</em></span>&gt;</span>
      <span class="lbl">${t('opening tag','تاج بيفتح')}</span>
    </span>
    <span class="apart txt" style="--d:1"><span class="acode">Home</span><span class="lbl">${t('content','المحتوى')}</span></span>
    <span class="apart tag" style="--d:2"><span class="acode">&lt;/a&gt;</span><span class="lbl">${t('closing tag','تاج بيقفل')}</span></span>
  </div>
  <p class="ana-cap" dir="auto">${t('Read it like a sentence: open the &lt;a&gt; tag, give it an <b>href</b> attribute, put the text “Home” inside, then close it with &lt;/a&gt;.','اقرأها كإنها جملة: افتح تاج الـ &lt;a&gt;، وإدّيله خاصية <b>href</b>، وحُط جوّه كلمة “Home”، وبعدين اقفله بـ &lt;/a&gt;.')}</p>
</div>`; }

const BYLINE = ()=>`<p style="margin-top:20px"><em style="color:var(--text2)">${t('Created by Eng. Enas Abdelqader','إعداد: م. إيناس عبد القادر')}</em></p>`;

/* ================= LESSONS CONTENT ================= */

  <div class="callout note"><span class="ic"><i class="fa-solid fa-bullseye"></i></span><div><strong>${t("What you'll master:",'اللي هتشتغل عليه وتتقنه:')}</strong> ${t('document structure, tags &amp; attributes, semantic vs. non-semantic elements, headings, paragraphs &amp; text formatting, lists, links, media, tables, and forms.','تركيب الصفحة، التاجات والخصائص، العناصر الدالة وغير الدالة، العناوين، الفقرات وتنسيق النص، اللوائم، الروابط، الوسائط، الجداول، والفورمات.')}</div></div>
