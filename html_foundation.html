L.push({ id:'structure', icon:'fa-solid fa-cubes',
  nav:{en:'1 · Document structure', ar:'1 · تركيب المستند'},
  section:{en:'Core', ar:'الأساسيات'},
  body:()=>`
  <span class="kicker">${t('Lesson 1','الدرس 1')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-cubes"></i></span> ${t('Document structure','تركيب المستند')}</h2>
  <p class="lead">${t('Every HTML page follows the same skeleton. Learn each part and why it exists.','أي صفحة HTML بتمشي على نفس الهيكل. تعالى نفهم كل جزء وليه موجود.')}</p>

  <h3>${t('What is HTML?','يعني إيه HTML؟')}</h3>
  <p>${t('<strong>HTML</strong> (HyperText Markup Language) is not a programming language — it’s a <em>markup</em> language. You use it to describe the <strong>structure and meaning</strong> of content: “this is a heading,” “this is a paragraph,” “this is a link.” The browser reads your markup and renders a visual page.','<strong>HTML</strong> مش لغة برمجة — دي لغة <em>وصف (markup)</em>. بتستخدمها علشان توصف <strong>تركيب ومعنى</strong> المحتوى: أهو عنوان، ودي فقرة، وده رابط. والمتصفح بيقرا الكود ده ويطلعلك صفحة شكلها حلو.')}</p>

  <h3>${t('The standard skeleton','الهيكل القياسي')}</h3>
  ${codeBlock('index.html', `<!DOCTYPE html>\n<html lang="en">\n  <head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>My First Page</title>\n  </head>\n  <body>\n    <h1>Hello, world!</h1>\n    <p>This is my first web page.</p>\n  </body>\n</html>`)}

  <h4>${t('Part by part','جزء جزء')}</h4>
  <table class="ref"><thead><tr><th>${t('Part','الجزء')}</th><th>${t('Role','بيعمل إيه')}</th></tr></thead><tbody>
    <tr><td><code>&lt;!DOCTYPE html&gt;</code></td><td>${t('Tells the browser to use modern HTML5 rules. Always the first line.','بيقول للمتصفح يستخدم قواعد HTML5 الحديثة. دايمًا أول سطر.')}</td></tr>
    <tr><td><code>&lt;html&gt;</code></td><td>${t('The <strong>root</strong> element that wraps the whole page. <code>lang="en"</code> declares the language.','العنصر <strong>الجذر</strong> اللي لافف الصفحة كلها. و<code>lang="en"</code> بيحدد اللغة.')}</td></tr>
    <tr><td><code>&lt;head&gt;</code></td><td>${t('Invisible <strong>metadata</strong>: title, character set, viewport, links to CSS. Not shown on the page.','<strong>بيانات وصفية</strong> مش ظاهرة: العنوان، ترميز الحروف، الـ viewport، وروابط الـ CSS. مابتظهرش في الصفحة.')}</td></tr>
    <tr><td><code>&lt;meta charset&gt;</code></td><td>${t('Sets text encoding to UTF-8 so all characters display correctly.','بيظبط ترميز النص على UTF-8 علشان كل الحروف تظهر صح (ومنه العربي).')}</td></tr>
    <tr><td><code>&lt;meta viewport&gt;</code></td><td>${t('Makes the page responsive on mobile devices.','بيخلي الصفحة متجاوبة على الموبايل.')}</td></tr>
    <tr><td><code>&lt;title&gt;</code></td><td>${t('The text shown on the browser tab and in search results.','النص اللي بيظهر على تاب المتصفح وفي نتائج البحث.')}</td></tr>
    <tr><td><code>&lt;body&gt;</code></td><td>${t('Everything <strong>visible</strong>: text, images, links, buttons…','كل اللي <strong>ظاهر</strong>: نص، صور، روابط، أزرار…')}</td></tr>
  </tbody></table>

  <div class="callout note"><span class="ic"><i class="fa-solid fa-brain"></i></span><div><strong>${t('Mental model:','فكرها كده:')}</strong> ${t('<code>head</code> = the page’s ID card (info about the page). <code>body</code> = the page itself (what visitors see).','<code>head</code> = بطاقة الصفحة (معلومات عنها). و<code>body</code> = الصفحة نفسها (اللي الناس بتشوفه).')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  <p>${t('Change the title and the text inside <code>&lt;body&gt;</code>, then press <strong>Run</strong>.','غيّر الـ title والنص اللي جوّا <code>&lt;body&gt;</code>، وبعدين اضغط <strong>شغّل</strong>.')}</p>
  ${play(`<!DOCTYPE html>\n<html lang="en">\n  <head>\n    <title>Change me!</title>\n  </head>\n  <body>\n    <h1>Edit this heading</h1>\n    <p>And edit this paragraph, then press Run.</p>\n  </body>\n</html>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 1','تمرين 1')}</span>
    <h4>${t('Build a page skeleton from scratch','ابني هيكل صفحة من الأول')}</h4>
    <p class="goal">${t('In the live editor above, delete everything and recreate a complete valid page that:','في المحرر فوق، امسح كل حاجة واعمل صفحة كاملة صح:')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Starts with the correct doctype','تبدأ بالـ doctype الصح')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Has a <code>&lt;html&gt;</code> with a <code>lang</code> attribute','فيها <code>&lt;html&gt;</code> بخاصية <code>lang</code>')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t("Includes a <code>&lt;head&gt;</code> with a <code>&lt;title&gt;</code> of your name",'فيها <code>&lt;head&gt;</code> جواها <code>&lt;title&gt;</code> باسمك')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Has a <code>&lt;body&gt;</code> with one heading and two paragraphs about you','فيها <code>&lt;body&gt;</code> بيه عنوان وفقرتين عنك')}</li>
    </ul>
  </div>

  ${quiz(t('Which element contains content that is <strong>visible</strong> to visitors?','أنهي عنصر بيحط المحتوى اللي <strong>ظاهر</strong> للزوار؟'), ['&lt;head&gt;','&lt;title&gt;','&lt;body&gt;','&lt;meta&gt;'], 2, t('The &lt;body&gt; holds all visible content. The &lt;head&gt; only holds metadata like the title and character set.','الـ &lt;body&gt; بيشيل كل المحتوى الظاهر، والـ &lt;head&gt; بيشيل بس البيانات الوصفية.'))}
  ${quiz(t('What is the correct <strong>first line</strong> of an HTML5 document?','إيه الـ <strong>أول سطر</strong> الصح في مستند HTML5؟'), ['&lt;html5&gt;','&lt;!DOCTYPE html&gt;','&lt;doctype&gt;html5&lt;/doctype&gt;','&lt;head&gt;'], 1, t('&lt;!DOCTYPE html&gt; must be the very first line so the browser uses modern HTML5 rendering.','لازم &lt;!DOCTYPE html&gt; يكون أول سطر خالص علشان المتصفح يشتغل بقواعد HTML5.'))}
`});

L.push({ id:'tags', icon:'fa-solid fa-tag',
  nav:{en:'2 · Tags &amp; attributes', ar:'2 · التاجات والخصائص'},
  section:{en:'Core', ar:'الأساسيات'},
  body:()=>`
  <span class="kicker">${t('Lesson 2','الدرس 2')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-tag"></i></span> ${t('Tags &amp; attributes','التاجات والخصائص')}</h2>
  <p class="lead">${t('The building blocks of every element. Master this and you can read any HTML.','دي الطوب اللي بيتبني بيه أي عنصر. لما تفهمها هتقدر تقرا أي HTML.')}</p>

  <h3>${t('Anatomy of an element','تشريح العنصر')}</h3>
  <p>${t('An <strong>element</strong> is usually made of an opening tag, content, and a closing tag. <strong>Attributes</strong> add extra information and live inside the opening tag.','الـ<strong>عنصر</strong> غالبًا بيتكون من تاج بيفتح، ومحتوى، وتاج بيقفل. والـ<strong>خصائص (attributes)</strong> بتدي معلومات زيادة وبتتكتب جوّا التاج اللي بيفتح.')}</p>
  ${anatomy()}

  <div class="callout tip"><span class="ic"><i class="fa-solid fa-lightbulb"></i></span><div>${t('Think of an element like a labelled box: the <strong>opening tag</strong> says what it is, the <strong>content</strong> is what goes inside, and the <strong>closing tag</strong> seals the box shut.','فكّر في العنصر زي علبة عليها تكت: <strong>التاج اللي بيفتح</strong> بيقول ده إيه، و<strong>المحتوى</strong> هو اللي بتحطه جوّه، و<strong>التاج اللي بيقفل</strong> بيقفل العلبة.')}</div></div>

  <h4>${t('Another labelled example','مثال تاني متقسّم')}</h4>
  <p>${t('The exact same pattern works for any element. Look at this image tag:','نفس الفكرة بالظبط بتشتغل مع أي عنصر. بصّ على تاج الصورة ده:')}</p>
  ${codeBlock('','<img src="logo.png" alt="Company logo" width="120">')}
  <ul class="doc">
    <li><code>img</code> — ${t('the tag name — it says what kind of element this is.','اسم التاج — بيقول العنصر ده نوعه إيه.')}</li>
    <li><code>src</code>, <code>alt</code>, <code>width</code> — ${t('three attributes, each with its own value inside quotes.','ثلاث خصائص، كل واحدة ليها قيمة بين علامتين تنصيص.')}</li>
    <li>${t('There is no closing tag here — <code>&lt;img&gt;</code> is a void element (explained next).','مفيش تاج بيقفل هنا — <code>&lt;img&gt;</code> عنصر فارغ (هنشرحه تحت).')}</li>
  </ul>

  <h4>${t('The rules','القواعد')}</h4>
  <ul class="doc">
    <li>${t('Tags are wrapped in angle brackets: <code>&lt;p&gt;</code>.','التاجات بتتحط جوّا أقواس زاوية: <code>&lt;p&gt;</code>.')}</li>
    <li>${t('Most elements need a <strong>closing tag</strong> with a slash: <code>&lt;/p&gt;</code>.','معظم العناصر محتاجة <strong>تاج يقفل</strong> فيه شرطة: <code>&lt;/p&gt;</code>.')}</li>
    <li>${t('An attribute is written as <code>name="value"</code>, values in quotes.','الخاصية بتتكتب كده <code>name="value"</code>، والقيمة جوّا علامتين تنصيص.')}</li>
    <li>${t('You can have multiple attributes, separated by spaces.','تقدر تحط أكتر من خاصية، بينهم مسافة.')}</li>
  </ul>

  <h3>${t('Types of tags','أنواع التاجات')}</h3>
  <h4>${t('1. Container (paired) tags','1. تاجات حاوية (زوج)')}</h4>
  <p>${t('Wrap content between an opening and closing tag.','بتلف المحتوى بين تاج بيفتح وتاج بيقفل.')}</p>
  ${codeBlock('','<p>This text is inside a paragraph.</p>\n<strong>This is bold.</strong>')}
  <h4>${t('2. Empty tags (like &lt;br&gt; and &lt;hr&gt;)','2. التاجات الفارغة (زي &lt;br&gt; و &lt;hr&gt;)')}</h4>
  <p>${t('Have no content and no closing tag — they do their job alone.','مافيهاش محتوى ومالهاش تاج يقفل — بتعمل شغلها لوحدها.')}</p>
  ${codeBlock('','<br>      <!-- line break -->\n<hr>      <!-- horizontal rule -->')}

  <h4>${t('3. Self-closing tags (like &lt;img&gt;)','3. تاجات بتقفل نفسها (زي &lt;img&gt;)')}</h4>
  <p>${t('These also have no closing tag, but unlike empty tags they carry attributes that do the work. <code>&lt;img&gt;</code> is the classic example — it needs a <code>src</code> and an <code>alt</code>.','دي كمان مالهاش تاج بيقفل، بس على عكس الفارغة، بتشيل خصائص هي اللي بتعمل الشغل. <code>&lt;img&gt;</code> أشهر مثال — لازم يكون فيه <code>src</code> و <code>alt</code>.')}</p>
  ${codeBlock('','<img src="cat.jpg" alt="A cat">')}
  <div class="callout note"><span class="ic"><i class="fa-solid fa-magnifying-glass"></i></span><div>${t('The difference: <code>&lt;br&gt;</code> and <code>&lt;hr&gt;</code> are empty — they need nothing extra. <code>&lt;img&gt;</code> is self-closing but leans on its attributes to do anything.','الفرق: <code>&lt;br&gt;</code> و <code>&lt;hr&gt;</code> فاضيين — مش محتاجين حاجة زيادة. أما <code>&lt;img&gt;</code> فبيقفل نفسه بس بيعتمد على خصائصه عشان يعمل أي حاجة.')}</div></div>

  <h4>${t('Common tags at a glance','تاجات مشهورة في لمحة')}</h4>
  <table class="ref"><thead><tr><th>${t('Type','النوع')}</th><th>${t('Tag','التاج')}</th><th>${t('What it does','بيعمل إيه')}</th></tr></thead><tbody>
    <tr><td>${t('Container','حاوي')}</td><td><code>&lt;p&gt;…&lt;/p&gt;</code></td><td>${t('A paragraph of text','فقرة نص')}</td></tr>
    <tr><td>${t('Container','حاوي')}</td><td><code>&lt;a&gt;…&lt;/a&gt;</code></td><td>${t('A link to another page','لينك لصفحة تانية')}</td></tr>
    <tr><td>${t('Container','حاوي')}</td><td><code>&lt;ul&gt;…&lt;/ul&gt;</code></td><td>${t('A bulleted list','ليستة نقط')}</td></tr>
    <tr><td>${t('Empty','فارغ')}</td><td><code>&lt;br&gt;</code></td><td>${t('A single line break','سطر جديد')}</td></tr>
    <tr><td>${t('Empty','فارغ')}</td><td><code>&lt;hr&gt;</code></td><td>${t('A divider line','خط فاصل')}</td></tr>
    <tr><td>${t('Self-closing','بيقفل نفسه')}</td><td><code>&lt;img&gt;</code></td><td>${t('Shows an image','بيعرض صورة')}</td></tr>
  </tbody></table>
  <div class="callout note"><span class="ic"><i class="fa-solid fa-compass"></i></span><div>${t('Quick test: if a tag wraps text or other tags, it needs a closing tag. If it stands alone and does one job, it is usually empty or self-closing.','تست سريع: لو التاج بيلفّ نص أو تاجات تانية، يبقى محتاج تاج يقفل. لو واقف لوحده وبيعمل حاجة واحدة، غالبًا يبقى فارغ أو بيقفل نفسه.')}</div></div>

  <h3>${t('Common global attributes','خصائص عامة مشهورة')}</h3>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('Purpose','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>id</code></td><td>${t('Unique name for one element','اسم فريد لعنصر واحد')}</td><td><code>&lt;div id="hero"&gt;</code></td></tr>
    <tr><td><code>class</code></td><td>${t('Group label (reused, for CSS/JS)','اسم مجموعة (بيتكرر، للـ CSS/JS)')}</td><td><code>&lt;p class="note"&gt;</code></td></tr>
    <tr><td><code>style</code></td><td>${t('Inline CSS','CSS داخلي')}</td><td><code>&lt;p style="color:red"&gt;</code></td></tr>
    <tr><td><code>title</code></td><td>${t('Tooltip on hover','تلميح لما تقف بالماوس')}</td><td><code>&lt;span title="Hi!"&gt;</code></td></tr>
  </tbody></table>

  <div class="callout warn"><span class="ic"><i class="fa-solid fa-triangle-exclamation"></i></span><div><strong>${t('Nesting matters.','الترتيب مهم.')}</strong> ${t('Close tags in the reverse order you opened them: <code>&lt;p&gt;&lt;strong&gt;Hi&lt;/strong&gt;&lt;/p&gt;</code> ✅ — not <code>&lt;p&gt;&lt;strong&gt;Hi&lt;/p&gt;&lt;/strong&gt;</code> ❌.','اقفل التاجات بالعكس زي ما فتحتها: <code>&lt;p&gt;&lt;strong&gt;Hi&lt;/strong&gt;&lt;/p&gt;</code> ✅ — مش <code>&lt;p&gt;&lt;strong&gt;Hi&lt;/p&gt;&lt;/strong&gt;</code> ❌.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<p title="I am a tooltip — hover me!" style="color:#3A86FF">\n  Hover over me, then change my attributes.\n</p>\n<hr>\n<p>Add your own <strong>bold</strong> and <em>italic</em> words here.</p>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 2','تمرين 2')}</span>
    <h4>${t('Label the parts','سمّي الأجزاء')}</h4>
    <p class="goal">${t('Given <code>&lt;img src="logo.png" alt="Logo"&gt;</code>, identify in your notes: the tag name, each attribute name, and each value. Is it a container or empty tag?','بص على <code>&lt;img src="logo.png" alt="Logo"&gt;</code>، واكتب في ورقتك: اسم التاج، واسم كل خاصية، وكل قيمة. هو تاج حاوي ولا فارغ؟')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Name the tag','سمّي التاج')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('List both attributes and their values','اكتب الخاصيتين وقيمهم')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Explain why it needs no closing tag','اشرح ليه مالوش تاج يقفل')}</li>
    </ul>
  </div>

  ${quiz(t('In <code>&lt;a href="about.html"&gt;</code>, what is <code>href</code>?','...في <code>&lt;a href="about.html"&gt;</code>، إيه هي <code>href</code>؟'), [t('A tag','تاج'),t('An attribute','خاصية'),t('A value','قيمة'),t('Content','محتوى')], 1, t('href is an attribute. Its value is "about.html", and "a" is the tag name.','الـ href خاصية، وقيمتها "about.html"، والـ "a" هو اسم التاج.'))}
  ${quiz(t('Which of these is an <strong>empty (void)</strong> element?','أنهي واحد فيهم عنصر <strong>فارغ (void)</strong>؟'), ['&lt;p&gt;','&lt;div&gt;','&lt;img&gt;','&lt;span&gt;'], 2, t('&lt;img&gt; is a void element — it has no content and no closing tag. p, div, and span are containers.','&lt;img&gt; عنصر فارغ — مالوش محتوى ولا تاج يقفل. أما p و div و span فحاوية.'))}
`});

L.push({ id:'semantic', icon:'fa-solid fa-puzzle-piece',
  nav:{en:'3 · Semantic elements', ar:'3 · العناصر الدالة'},
  section:{en:'Core', ar:'الأساسيات'},
  body:()=>`
  <span class="kicker">${t('Lesson 3','الدرس 3')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-puzzle-piece"></i></span> ${t('Semantic vs. non-semantic elements','العناصر الدالة وغير الدالة')}</h2>
  <p class="lead">${t('Some elements describe what they are. Others are just boxes. Knowing the difference makes your code clearer, more accessible, and better for SEO.','في عناصر بتقول هي إيه، وفي عناصر مجرد صناديق. لما تعرف الفرق كودك بيبقى أوضح وأسهل لذوي الاحتياجات وأحسن لمحركات البحث.')}</p>

  <h3>${t('What does “semantic” mean?','يعني إيه “دالّ” (semantic)؟')}</h3>
  <p>${t('A <strong>semantic</strong> element clearly describes its meaning to both the browser and the developer. <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, and <code>&lt;footer&gt;</code> tell you exactly what they contain. A <strong>non-semantic</strong> element like <code>&lt;div&gt;</code> or <code>&lt;span&gt;</code> says nothing about its content — it is just a generic container.','العنصر <strong>الدالّ</strong> بيوصف معناه بوضوح للمتصفح وللمطور. <code>&lt;header&gt;</code> و<code>&lt;nav&gt;</code> و<code>&lt;footer&gt;</code> بتقولك بالظبط جواها إيه. لكن العنصر <strong>غير الدالّ</strong> زي <code>&lt;div&gt;</code> أو <code>&lt;span&gt;</code> مابيقولش حاجة عن محتواه — مجرد صندوق عادي.')}</p>

  <h3>${t('Common semantic elements','أشهر العناصر الدالة')}</h3>
  <table class="ref"><thead><tr><th>${t('Element','العنصر')}</th><th>${t('Meaning','معناه')}</th></tr></thead><tbody>
    <tr><td><code>&lt;header&gt;</code></td><td>${t('Top of a page or section (logo, title, intro)','أعلى الصفحة أو القسم (لوجو، عنوان، مقدمة)')}</td></tr>
    <tr><td><code>&lt;nav&gt;</code></td><td>${t('A block of navigation links','بلوك لروابط التنقل')}</td></tr>
    <tr><td><code>&lt;main&gt;</code></td><td>${t('The main unique content (one per page)','المحتوى الرئيسي الفريد (واحد لكل صفحة)')}</td></tr>
    <tr><td><code>&lt;section&gt;</code></td><td>${t('A thematic group of content','مجموعة محتوى ليها موضوع')}</td></tr>
    <tr><td><code>&lt;article&gt;</code></td><td>${t('Self-contained content (post, card, news item)','محتوى قائم بذاته (بوست، كارت، خبر)')}</td></tr>
    <tr><td><code>&lt;aside&gt;</code></td><td>${t('Side content (sidebar, related links)','محتوى جانبي (شريط جانبي، روابط ذات صلة)')}</td></tr>
    <tr><td><code>&lt;footer&gt;</code></td><td>${t('Bottom of a page or section','أسفل الصفحة أو القسم')}</td></tr>
    <tr><td><code>&lt;figure&gt;</code> / <code>&lt;figcaption&gt;</code></td><td>${t('An image/illustration with a caption','صورة أو رسمة مع شرح')}</td></tr>
    <tr><td><code>&lt;time&gt;</code>, <code>&lt;mark&gt;</code></td><td>${t('A date/time, and highlighted text','تاريخ/وقت، ونص مظلل')}</td></tr>
  </tbody></table>

  <h3>${t('Non-semantic elements','العناصر غير الدالة')}</h3>
  <ul class="doc">
    <li><code>&lt;div&gt;</code> — ${t('a generic <strong>block</strong> container used for layout/styling.','صندوق <strong>بلوك</strong> عام بيتستخدم للتنسيق والتخطيط.')}</li>
    <li><code>&lt;span&gt;</code> — ${t('a generic <strong>inline</strong> container for a bit of text.','صندوق <strong>متضمّن (inline)</strong> عام لجزء صغير من النص.')}</li>
  </ul>
  <p>${t('They are perfectly fine — but use them only when no semantic element fits.','هما كويسين جدًا — بس استخدمهم بس لما مايكونش في عنصر دالّ مناسب.')}</p>

  <h3>${t('Same page, two ways','نفس الصفحة بطريقتين')}</h3>
  <p>${t('❌ Non-semantic “div soup” — works, but means nothing:','❌ طريقة غير دالة (حساء الـ div) — شغالة، بس ماتعنيش حاجة:')}</p>
  ${codeBlock('','<div class="header">...</div>\n<div class="nav">...</div>\n<div class="main">\n  <div class="article">...</div>\n</div>\n<div class="footer">...</div>')}
  <p>${t('✅ Semantic — same layout, but full of meaning:','✅ طريقة دالة — نفس التخطيط، بس مليانة معنى:')}</p>
  ${codeBlock('','<header>...</header>\n<nav>...</nav>\n<main>\n  <article>...</article>\n</main>\n<footer>...</footer>')}

  <div class="callout tip"><span class="ic"><i class="fa-solid fa-universal-access"></i></span><div>${t('Screen readers, search engines, and teammates all understand semantic tags instantly. Reach for <code>&lt;div&gt;</code> only when nothing more meaningful exists.','قارئات الشاشة ومحركات البحث وزمايلك في الشغل كلهم بيفهموا التاجات الدالة علىطول. ماتروحش للـ <code>&lt;div&gt;</code> إلا لما مايكونش في حاجة أوضح.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<header style="background:#EEF4FF;padding:12px">\n  <h1>My Blog</h1>\n  <nav>Home · About · Contact</nav>\n</header>\n<main style="padding:12px">\n  <article>\n    <h2>First post</h2>\n    <p>Semantic tags describe meaning.</p>\n  </article>\n  <aside><small>Related links here.</small></aside>\n</main>\n<footer style="background:#F4EDE0;padding:12px">\n  <small>© 2026</small>\n</footer>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 3','تمرين 3')}</span>
    <h4>${t('Fix the div soup','صلّح حساء الـ div')}</h4>
    <p class="goal">${t('In the editor above, replace the generic containers with semantic ones so the page has a real header, nav, main, an article, and a footer.','في المحرر فوق، استبدل الصناديق العامة بعناصر دالة علشان الصفحة يبقى فيها header وnav وmain وarticle وfooter حقيقيين.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Uses at least 4 different semantic elements','استخدم 4 عناصر دالة مختلفة على الأقل')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('One <code>&lt;main&gt;</code> only','<code>&lt;main&gt;</code> واحد بس')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('No <code>&lt;div&gt;</code> unless truly needed','مافيش <code>&lt;div&gt;</code> إلا لو محتاجه فعلاً')}</li>
    </ul>
  </div>

  ${quiz(t('Which element is <strong>non-semantic</strong>?','أنهي عنصر <strong>غير دالّ</strong>؟'), ['&lt;article&gt;','&lt;nav&gt;','&lt;div&gt;','&lt;footer&gt;'], 2, t('&lt;div&gt; is a generic container with no meaning. The others clearly describe their content.','&lt;div&gt; صندوق عام مالوش معنى، أما الباقين بيوصفوا محتواهم بوضوح.'))}
  ${quiz(t('What is a key benefit of semantic HTML?','إيه أهم فايدة للـ HTML الدالّ؟'), [t('It loads faster than any other HTML','بيحمّل أسرع من أي HTML تاني'),t('Better accessibility &amp; SEO','أحسن للوصولية ومحركات البحث'),t('It removes the need for CSS','بيغنيك عن الـ CSS'),t('It only works on mobile','بيشتغل على الموبايل بس')], 1, t('Semantic tags help screen readers and search engines understand your page, improving accessibility and SEO.','التاجات الدالة بتساعد قارئات الشاشة ومحركات البحث تفهم صفحتك، فبتحسّن الوصولية والـ SEO.'))}
  ${quiz(t('You need a generic inline wrapper for a few words. Use:','محتاج صندوق inline عام لكلمتين. تستخدم:'), ['&lt;div&gt;','&lt;span&gt;','&lt;section&gt;','&lt;p&gt;'], 1, t('&lt;span&gt; is the generic inline container; &lt;div&gt; is block-level.','&lt;span&gt; هو الصندوق الـ inline العام، أما &lt;div&gt; فبلوك.'))}
`});

L.push({ id:'headings', icon:'fa-solid fa-font',
  nav:{en:'4 · Headings h1–h6', ar:'4 · العناوين h1–h6'},
  section:{en:'Content', ar:'المحتوى'},
  body:()=>`
  <span class="kicker">${t('Lesson 4','الدرس 4')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-font"></i></span> ${t('Headings: h1–h6','العناوين: h1–h6')}</h2>
  <p class="lead">${t('Six levels of headings create a clear content hierarchy — for readers and for search engines.','ست مستويات للعناوين بتعمل ترتيب واضح للمحتوى — للقارئ ولمحركات البحث.')}</p>

  <h3>${t('The six levels','الست مستويات')}</h3>
  <p>${t('<code>&lt;h1&gt;</code> is the most important (largest), <code>&lt;h6&gt;</code> the least. Think of them like an outline: title → section → subsection.','<code>&lt;h1&gt;</code> هو الأهم (والأكبر)، و<code>&lt;h6&gt;</code> الأقل. فكّر فيهم زي فهرس: عنوان ← قسم ← قسم فرعي.')}</p>
  ${codeBlock('','<h1>Main title (one per page)</h1>\n<h2>Section</h2>\n<h3>Subsection</h3>\n<h4>Sub-subsection</h4>\n<h5>Minor heading</h5>\n<h6>Smallest heading</h6>')}

  <div class="callout tip"><span class="ic"><i class="fa-solid fa-lightbulb"></i></span><div><strong>${t('Best practice:','أفضل ممارسة:')}</strong> ${t('Use exactly <strong>one <code>&lt;h1&gt;</code></strong> per page (the page’s main title). Don’t skip levels (h2 → h4) — go in order. Never pick a heading just because it “looks” bigger; use CSS for size.','استخدم <strong><code>&lt;h1&gt;</code> واحد بس</strong> في الصفحة (العنوان الرئيسي). وماتنطّش مستويات (من h2 ل h4) — امشي بالترتيب. وماتختارش عنوان علشان “شكله” أكبر؛ استخدم CSS للحجم.')}</div></div>

  <h3>${t('Why headings matter','ليه العناوين مهمة')}</h3>
  <ul class="doc">
    <li><strong>${t('Accessibility:','الوصولية:')}</strong> ${t('screen readers let users jump between headings.','قارئات الشاشة بتخلي المستخدم ينط بين العناوين.')}</li>
    <li><strong>SEO:</strong> ${t('search engines use them to understand your page.','محركات البحث بتستخدمها علشان تفهم صفحتك.')}</li>
    <li><strong>${t('Structure:','الترتيب:')}</strong> ${t('they give readers a scannable outline.','بتدي للقارئ فهرس سهل يتصفحه.')}</li>
  </ul>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<h1>Cooking Blog</h1>\n<h2>Breakfast</h2>\n<h3>Pancakes</h3>\n<p>Fluffy and quick.</p>\n<h3>Omelette</h3>\n<p>Protein-packed.</p>\n<h2>Dinner</h2>\n<p>Add your own subsections!</p>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 4','تمرين 4')}</span>
    <h4>${t('Outline an article','اعمل فهرس مقال')}</h4>
    <p class="goal">${t('Build a heading structure for a page titled “Learning Python.” Use one h1, two h2 sections (e.g. “Variables,” “Loops”), and an h3 under each. Add a short paragraph after each h3.','ابني ترتيب عناوين لصفحة اسمها “Learning Python”. استخدم h1 واحد، و h2 لقسمين (مثلاً “Variables” و“Loops”)، و h3 تحت كل واحد. وحط فقرة قصيرة بعد كل h3.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Exactly one h1','h1 واحد بس')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Logical order, no skipped levels','ترتيب منطقي بدون قفز')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('At least two h3 subsections','على الأقل h3 لقسمين فرعيين')}</li>
    </ul>
  </div>

  ${quiz(t('How many <code>&lt;h1&gt;</code> elements should a typical page have?','الصفحة العادية المفروض فيها كام <code>&lt;h1&gt;</code>؟'), [t('As many as you like','زي ما تحب'),t('Exactly one','واحد بس'),t('At least six','ستة على الأقل'),t('Zero','ولا واحد')], 1, t('Use one h1 as the main page title. Additional sections use h2–h6 in order.','استخدم h1 واحد كعنوان رئيسي، والأقسام التانية تاخد h2–h6 بالترتيب.'))}
  ${quiz(t('You need a heading to look smaller. What should you do?','عايز عنوان يبان أصغر. تعمل إيه؟'), [t('Use a lower-importance tag like h5','تستخدم تاج أقل زي h5'),t('Keep the correct level and shrink it with CSS','تسيب المستوى الصح وتصغّره بالـ CSS'),t('Use &lt;p&gt; with bold','تستخدم &lt;p&gt; بخط عريض'),t('Use &lt;small&gt;','تستخدم &lt;small&gt;')], 1, t('Choose headings by meaning/hierarchy, not size. Control appearance with CSS so structure stays correct.','اختر العنوان حسب المعنى والترتيب مش الحجم. واتحكم في الشكل بالـ CSS علشان التركيب يفضل صح.'))}
`});

L.push({ id:'text', icon:'fa-solid fa-pen-nib',
  nav:{en:'5 · Paragraphs &amp; format', ar:'5 · الفقرات والتنسيق'},
  section:{en:'Content', ar:'المحتوى'},
  body:()=>`
  <span class="kicker">${t('Lesson 5','الدرس 5')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-pen-nib"></i></span> ${t('Paragraphs &amp; text formatting','الفقرات وتنسيق النص')}</h2>
  <p class="lead">${t('Write readable text and add meaning with formatting elements.','اكتب نص سهل القراية وزوّد له معنى بعناصر التنسيق.')}</p>

  <h3>${t('Paragraphs','الفقرات')}</h3>
  <p>${t('The <code>&lt;p&gt;</code> element defines a paragraph. Browsers add space above and below automatically. Extra spaces and line breaks in your code are collapsed — use elements, not whitespace, to format.','عنصر <code>&lt;p&gt;</code> بيعرّف فقرة. المتصفح بيحط مسافة فوق وتحت أوتوماتيك. والمسافات والأسطر الزيادة بتندمج — فاستخدم عناصر، مش مسافات، علشان تنسّق.')}</p>
  ${codeBlock('','<p>This is one paragraph.</p>\n<p>This is a separate paragraph.</p>')}

  <h3>${t('Line breaks &amp; rules','فواصل الأسطر والخطوط')}</h3>
  <table class="ref"><thead><tr><th>${t('Tag','التاج')}</th><th>${t('Effect','بيعمل إيه')}</th></tr></thead><tbody>
    <tr><td><code>&lt;br&gt;</code></td><td>${t('A single line break (e.g. inside an address)','كسر سطر واحد (مثلاً جوّا عنوان)')}</td></tr>
    <tr><td><code>&lt;hr&gt;</code></td><td>${t('A thematic break — a horizontal divider line','فاصل موضوعي — خط أفقي فاصل')}</td></tr>
  </tbody></table>

  <h3>${t('Text formatting elements','عناصر تنسيق النص')}</h3>
  <table class="ref"><thead><tr><th>${t('Tag','التاج')}</th><th>${t('Meaning','المعنى')}</th><th>${t('Looks like','شكله')}</th></tr></thead><tbody>
    <tr><td><code>&lt;strong&gt;</code></td><td>${t('Strong importance','أهمية عالية')}</td><td><strong>${t('bold','عريض')}</strong></td></tr>
    <tr><td><code>&lt;em&gt;</code></td><td>${t('Emphasis','تأكيد')}</td><td><em>${t('italic','مائل')}</em></td></tr>
    <tr><td><code>&lt;mark&gt;</code></td><td>${t('Highlighted','مظلل')}</td><td><mark>${t('highlight','تظليل')}</mark></td></tr>
    <tr><td><code>&lt;small&gt;</code></td><td>${t('Fine print','نص صغير')}</td><td><small>${t('small','صغير')}</small></td></tr>
    <tr><td><code>&lt;del&gt;</code></td><td>${t('Deleted text','نص محذوف')}</td><td><del>${t('removed','اتشال')}</del></td></tr>
    <tr><td><code>&lt;ins&gt;</code></td><td>${t('Inserted text','نص مضاف')}</td><td><ins>${t('added','اتضاف')}</ins></td></tr>
    <tr><td><code>&lt;sub&gt;</code>/<code>&lt;sup&gt;</code></td><td>${t('Subscript / superscript','سفلي / علوي')}</td><td>H<sub>2</sub>O, x<sup>2</sup></td></tr>
    <tr><td><code>&lt;code&gt;</code></td><td>${t('Inline code','كود داخلي')}</td><td><code>let x=1</code></td></tr>
  </tbody></table>

  <div class="callout warn"><span class="ic"><i class="fa-solid fa-circle-exclamation"></i></span><div><strong>${t('Meaning over looks.','المعنى قبل الشكل.')}</strong> ${t('Prefer <code>&lt;strong&gt;</code>/<code>&lt;em&gt;</code> (which carry meaning) over the old <code>&lt;b&gt;</code>/<code>&lt;i&gt;</code>. Screen readers announce emphasis.','فضّل <code>&lt;strong&gt;</code>/<code>&lt;em&gt;</code> (اللي ليهم معنى) على القدام <code>&lt;b&gt;</code>/<code>&lt;i&gt;</code>. قارئات الشاشة بتنطق التأكيد.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<p>Water is <strong>essential</strong>: <em>drink</em> enough daily.</p>\n<p>Formula: H<sub>2</sub>O. Area = r<sup>2</sup> × π.</p>\n<p><mark>Highlight</mark> what matters, <del>cross out</del> what changed.</p>\n<hr>\n<p><small>Fine print goes here.</small></p>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 5','تمرين 5')}</span>
    <h4>${t('Format a short bio','نسّق نبذة قصيرة')}</h4>
    <p class="goal">${t('Write two paragraphs about your favorite hobby. Make one word bold with <code>&lt;strong&gt;</code>, one italic with <code>&lt;em&gt;</code>, and highlight one with <code>&lt;mark&gt;</code>. Separate the two paragraphs with an <code>&lt;hr&gt;</code>.','اكتب فقرتين عن هوايتك المفضلة. خلّي كلمة عريضة بـ <code>&lt;strong&gt;</code>، وواحدة مائلة بـ <code>&lt;em&gt;</code>، وظلّل واحدة بـ <code>&lt;mark&gt;</code>. وافصل بين الفقرتين بـ <code>&lt;hr&gt;</code>.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Two &lt;p&gt; elements','عنصري &lt;p&gt;')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Uses strong, em, and mark','فيه strong و em و mark')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('An &lt;hr&gt; between them','&lt;hr&gt; بينهم')}</li>
    </ul>
  </div>

  ${quiz(t('Which element carries <strong>meaning</strong> (importance), not just bold styling?','أنهي عنصر بيحمل <strong>معنى</strong> (أهمية)، مش بس تعريض؟'), ['&lt;b&gt;','&lt;strong&gt;','&lt;big&gt;','&lt;style&gt;'], 1, t('&lt;strong&gt; conveys strong importance and is announced by screen readers; &lt;b&gt; is purely visual.','&lt;strong&gt; بيعبّر عن أهمية وقارئات الشاشة بتنطقه، أما &lt;b&gt; فشكلي بس.'))}
  ${quiz(t('What does <code>&lt;br&gt;</code> do?','<code>&lt;br&gt;</code> بيعمل إيه؟'), [t('Starts a new paragraph','يبدأ فقرة جديدة'),t('Inserts a single line break','يعمل كسر سطر واحد'),t('Makes text bold','يخلي النص عريض'),t('Adds a horizontal line','يضيف خط أفقي')], 1, t('&lt;br&gt; is a single line break. &lt;hr&gt; adds a horizontal rule; &lt;p&gt; starts a paragraph.','&lt;br&gt; كسر سطر واحد. &lt;hr&gt; خط أفقي، و&lt;p&gt; يبدأ فقرة.'))}
`});

L.push({ id:'lists', icon:'fa-solid fa-list-ul',
  nav:{en:'6 · Lists', ar:'6 · اللوائم'},
  section:{en:'Content', ar:'المحتوى'},
  body:()=>`
  <span class="kicker">${t('Lesson 6','الدرس 6')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-list-ul"></i></span> ${t('Lists','اللوائم')}</h2>
  <p class="lead">${t('Three list types for three jobs: unordered, ordered, and description lists.','تلات أنواع لوائم لتلات استخدامات: غير مرتبة، مرتبة، وتعريفية.')}</p>

  <h3>${t('1. Unordered list','1. لائمة غير مرتبة')}</h3>
  <p>${t('Use <code>&lt;ul&gt;</code> when order does not matter. Each item is an <code>&lt;li&gt;</code>. Renders with bullets.','استخدم <code>&lt;ul&gt;</code> لمّا الترتيب مايفرقش. كل عنصر <code>&lt;li&gt;</code>. بيطلع بنقط.')}</p>
  ${codeBlock('','<ul>\n  <li>Milk</li>\n  <li>Bread</li>\n  <li>Eggs</li>\n</ul>')}

  <h3>${t('2. Ordered list','2. لائمة مرتبة')}</h3>
  <p>${t('Use <code>&lt;ol&gt;</code> when sequence matters (steps, rankings). Renders with numbers.','استخدم <code>&lt;ol&gt;</code> لمّا الترتيب يهم (خطوات، ترتيب). بيطلع بأرقام.')}</p>
  ${codeBlock('','<ol>\n  <li>Preheat the oven</li>\n  <li>Mix ingredients</li>\n  <li>Bake 20 minutes</li>\n</ol>')}
  <p>${t('Handy <code>&lt;ol&gt;</code> attributes: <code>type="A"</code> (letters), <code>start="3"</code> (start number), <code>reversed</code>.','خصائص مفيدة لـ <code>&lt;ol&gt;</code>: <code>type="A"</code> (حروف)، <code>start="3"</code> (يبدأ من رقم)، <code>reversed</code>.')}</p>

  <h3>${t('3. Description list','3. لائمة تعريفية')}</h3>
  <p>${t('Use <code>&lt;dl&gt;</code> for term/definition pairs: <code>&lt;dt&gt;</code> is the term, <code>&lt;dd&gt;</code> is the description.','استخدم <code>&lt;dl&gt;</code> لأزواج مصطلح/تعريف: <code>&lt;dt&gt;</code> المصطلح، <code>&lt;dd&gt;</code> الشرح.')}</p>
  ${codeBlock('','<dl>\n  <dt>HTML</dt>\n  <dd>The structure of a page.</dd>\n  <dt>CSS</dt>\n  <dd>The styling of a page.</dd>\n</dl>')}

  <div class="callout note"><span class="ic"><i class="fa-solid fa-circle-info"></i></span><div><strong>${t('Nesting:','التداخل:')}</strong> ${t('you can put a full <code>&lt;ul&gt;</code> or <code>&lt;ol&gt;</code> <em>inside</em> an <code>&lt;li&gt;</code> to create sub-lists — just keep the nesting valid.','تقدر تحط <code>&lt;ul&gt;</code> أو <code>&lt;ol&gt;</code> كاملة <em>جوّا</em> <code>&lt;li&gt;</code> علشان تعمل لوائم فرعية — بس خلّي التداخل صح.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<h3>Morning routine</h3>\n<ol>\n  <li>Wake up</li>\n  <li>Coffee\n    <ul>\n      <li>Beans</li>\n      <li>Water</li>\n    </ul>\n  </li>\n  <li>Code!</li>\n</ol>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 6','تمرين 6')}</span>
    <h4>${t('Build a nested menu','ابني منيو متداخل')}</h4>
    <p class="goal">${t('Create a restaurant menu: an unordered list of categories (Starters, Mains, Drinks), each containing a nested list of two dishes. Add a description list defining two dishes.','اعمل منيو مطعم: قائمة غير مرتبة للفئات (مقبلات، أطباق رئيسية، مشروبات)، وكل واحدة جواها قائمة فرعية بطبقين. وزوّد قائمة تعريفية تعرّف طبقين.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('A &lt;ul&gt; with 3 categories','&lt;ul&gt; فيها 3 فئات')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Each has a nested list','كل واحدة ليها قائمة فرعية')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('One &lt;dl&gt; with two dt/dd pairs','&lt;dl&gt; واحدة بزوجين dt/dd')}</li>
    </ul>
  </div>

  ${quiz(t('Which list should you use for step-by-step instructions?','أنهي قائمة تستخدمها لخطوات بالترتيب؟'), ['&lt;ul&gt;','&lt;ol&gt;','&lt;dl&gt;','&lt;li&gt;'], 1, t('&lt;ol&gt; (ordered list) numbers items, which is perfect for sequential steps.','&lt;ol&gt; (قائمة مرتبة) بترقّم العناصر، وده مثالي للخطوات.'))}
  ${quiz(t('Inside a <code>&lt;ul&gt;</code>, each item must be wrapped in:','جوّا <code>&lt;ul&gt;</code>، كل عنصر لازم يتلف بـ:'), ['&lt;item&gt;','&lt;li&gt;','&lt;dd&gt;','&lt;p&gt;'], 1, t('List items use &lt;li&gt; inside both &lt;ul&gt; and &lt;ol&gt;.','عناصر اللائمة بتستخدم &lt;li&gt; جوّا &lt;ul&gt; و&lt;ol&gt;.'))}
`});

L.push({ id:'links', icon:'fa-solid fa-link',
  nav:{en:'7 · Links (anchor)', ar:'7 · الروابط (anchor)'},
  section:{en:'Connect', ar:'الربط'},
  body:()=>`
  <span class="kicker">${t('Lesson 7','الدرس 7')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-link"></i></span> ${t('Links: the anchor tag','الروابط: تاج الـ anchor')}</h2>
  <p class="lead">${t('The <code>&lt;a&gt;</code> element connects pages, sections, files, and email — it is what makes the web a “web.”','عنصر <code>&lt;a&gt;</code> بيوصّل الصفحات والأقسام والملفات والإيميل — وده اللي خلّى الويب “ويب”.')}</p>

  <h3>${t('Basic link','رابط أساسي')}</h3>
  <p>${t('The <code>href</code> attribute holds the destination. The content between the tags is the clickable text.','خاصية <code>href</code> فيها الوجهة. والمحتوى بين التاجات هو النص اللي بيتضغط.')}</p>
  ${codeBlock('','<a href="https://example.com">Visit Example</a>')}

  <h3>${t('&lt;a&gt; attributes reference','مرجع خصائص &lt;a&gt;')}</h3>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>href</code></td><td>${t('Where the link goes: a URL, a file, or #section','الرابط رايح فين: URL أو ملف أو #قسم')}</td><td><code>href="about.html"</code></td></tr>
    <tr><td><code>target</code></td><td>${t('Where to open it: _self (same tab) or _blank (new tab)','يفتح فين: _self (نفس التاب) أو _blank (تاب جديد)')}</td><td><code>target="_blank"</code></td></tr>
  </tbody></table>

  <div class="callout warn"><span class="ic"><i class="fa-solid fa-triangle-exclamation"></i></span><div><strong>${t('Write meaningful link text.','اكتب نص رابط ليه معنى.')}</strong> ${t('“Click here” tells screen-reader users nothing. Prefer “Read the setup guide.”','“Click here” مابتقولش حاجة لمستخدمي قارئات الشاشة. فضّل “اقرا دليل الإعداد”.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<p>\n  <a href="https://developer.mozilla.org" target="_blank" rel="noopener">\n    Open MDN in a new tab\n  </a>\n</p>\n<p><a href="mailto:hello@site.com">Email us</a></p>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 7','تمرين 7')}</span>
    <h4>${t('Build a mini navigation','ابني قائمة تنقل صغيرة')}</h4>
    <p class="goal">${t('Create a list of links: one external site (new tab), one internal page, one jump-to-section (#), and one email link. Give every link meaningful text.','اعمل لائمة روابط: موقع خارجي (تاب جديد)، صفحة داخلية، رابط لقسم (#)، ورابط إيميل. وخلي كل رابط نصه ليه معنى.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Four different href types','أربع أنواع href مختلفة')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('External link opens in new tab','الرابط الخارجي يفتح تاب جديد')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('No “click here” text','مافيش “click here”')}</li>
    </ul>
  </div>

  ${quiz(t('Which attribute makes a link open in a new tab?','أنهي خاصية بتخلي الرابط يفتح تاب جديد؟'), ['href="_blank"','target="_blank"','open="new"','rel="tab"'], 1, t('target="_blank" opens the destination in a new tab; pair it with rel="noopener".','target="_blank" بيفتح الوجهة في تاب جديد، وحطّ معاه rel="noopener".'))}
  ${quiz(t('Which attribute sets where a link goes?','أنهي خاصية بتحدد الرابط رايح فين؟'), ['href','target','src','link'], 0, t('href holds the destination — a URL, a file, or a #section.','href فيها وجهة الرابط — URL أو ملف أو #قسم.'))}
`});

L.push({ id:'media', icon:'fa-solid fa-clapperboard',
  nav:{en:'8 · Media', ar:'8 · الوسائط'},
  section:{en:'Connect', ar:'الربط'},
  body:()=>`
  <span class="kicker">${t('Lesson 8','الدرس 8')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-clapperboard"></i></span> ${t('Media: images, audio &amp; video','الوسائط: صور وصوت وفيديو')}</h2>
  <p class="lead">${t('Bring pages to life with images, audio, and video — accessibly.','خلي الصفحة حية بالصور والصوت والفيديو — وبطريقة متاحة للجميع.')}</p>

  <h3>${t('Images','الصور')}</h3>
  <p>${t('The <code>&lt;img&gt;</code> is a void element. <code>src</code> is the file path; <code>alt</code> is the text alternative shown if the image fails and read by screen readers.','عنصر <code>&lt;img&gt;</code> فارغ. <code>src</code> مسار الملف؛ و<code>alt</code> نص بديل بيظهر لو الصورة ماظهرتش وبتقراه قارئات الشاشة.')}</p>
  ${codeBlock('','<img src="cat.jpg" alt="A ginger cat sleeping" width="300">')}

  <h4>${t('&lt;img&gt; attributes','خصائص &lt;img&gt;')}</h4>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>src</code></td><td>${t('Path to the image file (required)','مسار ملف الصورة (لازم)')}</td><td><code>src="cat.jpg"</code></td></tr>
    <tr><td><code>alt</code></td><td>${t('Text alternative if the image fails (required)','نص بديل لو الصورة مطلعتش (لازم)')}</td><td><code>alt="A cat"</code></td></tr>
    <tr><td><code>width</code></td><td>${t('Width in pixels','العرض بالبكسل')}</td><td><code>width="300"</code></td></tr>
    <tr><td><code>height</code></td><td>${t('Height in pixels','الطول بالبكسل')}</td><td><code>height="200"</code></td></tr>
  </tbody></table>
  <div class="callout tip"><span class="ic"><i class="fa-solid fa-universal-access"></i></span><div>${t('Always write a useful <code>alt</code>. For purely decorative images, use empty <code>alt=""</code> so screen readers skip them.','دايمًا اكتب <code>alt</code> مفيد. لو الصورة للزينة بس، خلّي <code>alt=""</code> فاضي علشان قارئات الشاشة تعدّيها.')}</div></div>

  <h3>${t('Figure with caption','صورة بشرح')}</h3>
  ${codeBlock('','<figure>\n  <img src="chart.png" alt="Sales chart">\n  <figcaption>Q1 sales by region</figcaption>\n</figure>')}

  <h3>${t('Audio &amp; video','الصوت والفيديو')}</h3>
  <p>${t('Both use the <code>controls</code> attribute to show a player, and <code>&lt;source&gt;</code> children for multiple formats.','الاتنين بيستخدموا <code>controls</code> علشان يظهر مشغّل، و<code>&lt;source&gt;</code> لأكتر من صيغة.')}</p>
  ${codeBlock('','<audio controls>\n  <source src="song.mp3" type="audio/mpeg">\n  Your browser does not support audio.\n</audio>\n\n<video controls width="400" poster="cover.jpg">\n  <source src="clip.mp4" type="video/mp4">\n</video>')}

  <h4>${t('&lt;video&gt; attributes','خصائص &lt;video&gt;')}</h4>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>src</code></td><td>${t('Video file (or use inner source tags)','ملف الفيديو (أو استخدم تاجات source جوّه)')}</td><td><code>src="clip.mp4"</code></td></tr>
    <tr><td><code>controls</code></td><td>${t('Show play, pause, and volume controls','يظهر أزرار التشغيل والإيقاف والصوت')}</td><td><code>controls</code></td></tr>
    <tr><td><code>autoplay</code></td><td>${t('Start playing automatically','يشتغل لوحده أوتوماتيك')}</td><td><code>autoplay</code></td></tr>
    <tr><td><code>loop</code></td><td>${t('Repeat when it ends','يعيد من الأول لما يخلص')}</td><td><code>loop</code></td></tr>
    <tr><td><code>muted</code></td><td>${t('Start with no sound','يبدأ من غير صوت')}</td><td><code>muted</code></td></tr>
    <tr><td><code>width</code></td><td>${t('Width in pixels','العرض بالبكسل')}</td><td><code>width="400"</code></td></tr>
  </tbody></table>

  <h4>${t('&lt;audio&gt; attributes','خصائص &lt;audio&gt;')}</h4>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>src</code></td><td>${t('Audio file (or use inner source tags)','ملف الصوت (أو استخدم تاجات source جوّه)')}</td><td><code>src="song.mp3"</code></td></tr>
    <tr><td><code>controls</code></td><td>${t('Show the player controls','يظهر أزرار المشغّل')}</td><td><code>controls</code></td></tr>
    <tr><td><code>autoplay</code></td><td>${t('Start playing automatically','يشتغل لوحده')}</td><td><code>autoplay</code></td></tr>
    <tr><td><code>loop</code></td><td>${t('Repeat when it ends','يعيد لما يخلص')}</td><td><code>loop</code></td></tr>
    <tr><td><code>muted</code></td><td>${t('Start muted','يبدأ من غير صوت')}</td><td><code>muted</code></td></tr>
  </tbody></table>
  <div class="callout note"><span class="ic"><i class="fa-solid fa-circle-info"></i></span><div>${t('<code>controls</code>, <code>autoplay</code>, <code>loop</code>, and <code>muted</code> are boolean attributes — writing the name alone turns them on.','<code>controls</code> و <code>autoplay</code> و <code>loop</code> و <code>muted</code> خصائص boolean — بمجرد ما تكتب اسمها بس بتشتغل.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<figure style="margin:0">\n  <img src="https://picsum.photos/320/180" alt="Random scenery" width="320">\n  <figcaption><small>A random photo with a caption.</small></figcaption>\n</figure>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 8','تمرين 8')}</span>
    <h4>${t('Build an image gallery card','ابني كارت معرض صور')}</h4>
    <p class="goal">${t('Create a <code>&lt;figure&gt;</code> with an image (real alt text), a caption, and below it an audio player with controls. Then add width to the image.','اعمل <code>&lt;figure&gt;</code> فيه صورة (بـ alt حقيقي)، وشرح، وتحته مشغّل صوت بـ controls. وبعدين حط width للصورة.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('img has meaningful alt','الصورة ليها alt مفيد')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Wrapped in figure + figcaption','ملفوفة في figure + figcaption')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('An audio element with controls','عنصر audio بـ controls')}</li>
    </ul>
  </div>

  ${quiz(t('Which attribute provides a text alternative for an image?','أنهي خاصية بتدي نص بديل للصورة؟'), ['src','title','alt','caption'], 2, t('alt gives the text alternative — vital for accessibility and shown if the image fails to load.','alt بيدي النص البديل — مهم للوصولية وبيظهر لو الصورة ماحملتش.'))}
  ${quiz(t('What makes a <code>&lt;video&gt;</code> show play/pause controls?','إيه اللي بيخلي <code>&lt;video&gt;</code> يظهر أزرار التشغيل؟'), [t('The play attribute','خاصية play'),t('The controls attribute','خاصية controls'),t('The buttons attribute','خاصية buttons'),t('It is automatic','بتحصل أوتوماتيك')], 1, t('Add the boolean controls attribute to show the native player UI.','حط خاصية controls (boolean) علشان يظهر المشغّل.'))}
`});

L.push({ id:'tables', icon:'fa-solid fa-table',
  nav:{en:'9 · Tables', ar:'9 · الجداول'},
  section:{en:'Data &amp; input', ar:'بيانات وإدخال'},
  body:()=>`
  <span class="kicker">${t('Lesson 9','الدرس 9')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-table"></i></span> ${t('Tables','الجداول')}</h2>
  <p class="lead">${t('Present tabular data — rows and columns — with the right structure.','اعرض البيانات الجدولية — صفوف وأعمدة — بالتركيب الصح.')}</p>

  <h3>${t('Core parts','الأجزاء الأساسية')}</h3>
  <table class="ref"><thead><tr><th>${t('Tag','التاج')}</th><th>${t('Meaning','المعنى')}</th></tr></thead><tbody>
    <tr><td><code>&lt;table&gt;</code></td><td>${t('The whole table','الجدول كله')}</td></tr>
    <tr><td><code>&lt;tr&gt;</code></td><td>${t('Table row','صف')}</td></tr>
    <tr><td><code>&lt;th&gt;</code></td><td>${t('Header cell (bold, centered)','خلية عنوان (عريضة وفي النص)')}</td></tr>
    <tr><td><code>&lt;td&gt;</code></td><td>${t('Data cell','خلية بيانات')}</td></tr>
    <tr><td><code>&lt;thead&gt;</code>/<code>&lt;tbody&gt;</code>/<code>&lt;tfoot&gt;</code></td><td>${t('Group header, body, footer rows','مجموعة الرأس، الجسم، التذييل')}</td></tr>
    <tr><td><code>&lt;caption&gt;</code></td><td>${t('Table title','عنوان الجدول')}</td></tr>
  </tbody></table>

  <h3>${t('A complete table','جدول كامل')}</h3>
  ${codeBlock('','<table>\n  <caption>Class schedule</caption>\n  <thead>\n    <tr><th>Day</th><th>Subject</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Mon</td><td>HTML</td></tr>\n    <tr><td>Tue</td><td>CSS</td></tr>\n  </tbody>\n</table>')}

  <h3>${t('Spanning cells','دمج الخلايا')}</h3>
  <ul class="doc">
    <li><code>colspan="2"</code> — ${t('a cell stretches across 2 columns.','الخلية تمتد على عمودين.')}</li>
    <li><code>rowspan="2"</code> — ${t('a cell stretches down 2 rows.','الخلية تمتد على صفين.')}</li>
  </ul>
  ${codeBlock('','<tr>\n  <th colspan="2">Full width header</th>\n</tr>')}

  <h3>${t('&lt;table&gt; &amp; cell attributes','خصائص &lt;table&gt; والخلايا')}</h3>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>colspan</code></td><td>${t('Merge a cell across columns (on td or th)','تدمج الخلية على أكتر من عمود (على td أو th)')}</td><td><code>colspan="2"</code></td></tr>
    <tr><td><code>rowspan</code></td><td>${t('Merge a cell down rows (on td or th)','تدمج الخلية على أكتر من صف (على td أو th)')}</td><td><code>rowspan="2"</code></td></tr>
    <tr><td><code>border</code></td><td>${t('Draws lines around the table and cells (legacy — use CSS)','خط حوالين الجدول والخلايا (قديمة — استخدم CSS)')}</td><td><code>border="1"</code></td></tr>
    <tr><td><code>cellpadding</code></td><td>${t('Space inside each cell (legacy — use CSS padding)','مسافة جوّا كل خلية (قديمة — استخدم padding)')}</td><td><code>cellpadding="8"</code></td></tr>
    <tr><td><code>cellspacing</code></td><td>${t('Space between cells (legacy — use CSS border-spacing)','مسافة بين الخلايا (قديمة — استخدم border-spacing)')}</td><td><code>cellspacing="0"</code></td></tr>
    <tr><td><code>align</code></td><td>${t('Horizontal alignment of the table (legacy — use CSS margin)','محاذاة الجدول أفقيًا (قديمة — استخدم margin)')}</td><td><code>align="center"</code></td></tr>
    <tr><td><code>width</code></td><td>${t('Sets the table width (legacy — use CSS width)','بتحدد عرض الجدول (قديمة — استخدم width)')}</td><td><code>width="100%"</code></td></tr>
  </tbody></table>
  <div class="callout warn"><span class="ic">⚠️</span><div>${t('These attributes still work in browsers but are deprecated — prefer CSS for borders, spacing, alignment, and width.','الخصائص دي لسّه شغالة في المتصفحات بس بقت قديمة (deprecated) — الأفضل تستخدم CSS للحدود والمسافات والمحاذاة والعرض.')}</div></div>

  <div class="callout warn"><span class="ic">⚠️</span><div><strong>${t('Tables are for data, not layout.','الجداول للبيانات، مش للتخطيط.')}</strong> ${t('Never use tables to position page elements — use CSS for layout. Use tables only for genuine grids of data.','ماتستخدمش الجداول علشان ترتّب عناصر الصفحة — استخدم CSS للتخطيط. الجداول بس للبيانات الحقيقية.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<table border="1" cellpadding="6" style="border-collapse:collapse">\n  <caption><strong>Grades</strong></caption>\n  <thead>\n    <tr><th>Student</th><th>Math</th><th>Science</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Sara</td><td>90</td><td>88</td></tr>\n    <tr><td>Omar</td><td>75</td><td>82</td></tr>\n    <tr><td colspan="3">Add a new row below!</td></tr>\n  </tbody>\n</table>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 9','تمرين 9')}</span>
    <h4>${t('Build a price table','ابني جدول أسعار')}</h4>
    <p class="goal">${t('Create a table with a <code>&lt;caption&gt;</code>, a header row (<code>&lt;th&gt;</code>) for “Plan” and “Price,” and three data rows. Add a footer row that uses <code>colspan</code> to span both columns.','اعمل جدول فيه <code>&lt;caption&gt;</code>، وصف عناوين (<code>&lt;th&gt;</code>) لـ “Plan” و“Price”، وتلات صفوف بيانات. وزوّد صف تذييل يستخدم <code>colspan</code> يمتد على العمودين.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Uses thead + tbody','فيه thead + tbody')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Header cells use th','خلايا العناوين th')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('One cell uses colspan','خلية بتستخدم colspan')}</li>
    </ul>
  </div>

  ${quiz(t('Which tag creates a header cell?','أنهي تاج بيعمل خلية عنوان؟'), ['&lt;td&gt;','&lt;th&gt;','&lt;tr&gt;','&lt;head&gt;'], 1, t('&lt;th&gt; is a header cell (bold + centered by default). &lt;td&gt; is a normal data cell.','&lt;th&gt; خلية عنوان (عريضة وفي النص افتراضيًا). &lt;td&gt; خلية بيانات عادية.'))}
  ${quiz(t('To make one cell span two columns, you use:','علشان خلية تمتد على عمودين، تستخدم:'), ['rowspan="2"','colspan="2"','span="2"','width="2"'], 1, t('colspan="2" merges a cell across two columns; rowspan merges across rows.','colspan="2" بتدمج الخلية على عمودين، وrowspan على صفوف.'))}
`});

L.push({ id:'forms', icon:'fa-solid fa-square-poll-horizontal',
  nav:{en:'10 · Forms', ar:'10 · الفورمات'},
  section:{en:'Data &amp; input', ar:'بيانات وإدخال'},
  body:()=>`
  <span class="kicker">${t('Lesson 10','الدرس 10')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-square-poll-horizontal"></i></span> ${t('Forms','الفورمات')}</h2>
  <p class="lead">${t('Collect input from users — text, choices, and submissions — accessibly and correctly.','جمّع بيانات من المستخدمين — نص، اختيارات، وإرسال — بطريقة متاحة وصح.')}</p>

  <h3>${t('The form container','حاوية الفورم')}</h3>
  <p>${t('<code>&lt;form&gt;</code> wraps the inputs. <code>action</code> is where data is sent; <code>method</code> is how (<code>get</code> أو <code>post</code>).','<code>&lt;form&gt;</code> بيلف المدخلات. <code>action</code> فين البيانات بتتبعت؛ <code>method</code> إزاي (<code>get</code> أو <code>post</code>).')}</p>
  ${codeBlock('','<form action="/signup" method="post">\n  ...\n</form>')}

  <h4>${t('&lt;form&gt; attributes','خصائص &lt;form&gt;')}</h4>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>action</code></td><td>${t('URL that receives the submitted data','الـ URL اللي بيستقبل البيانات المرسلة')}</td><td><code>action="/signup"</code></td></tr>
    <tr><td><code>method</code></td><td>${t('How to send it: get or post','بتتبعت إزاي: get أو post')}</td><td><code>method="post"</code></td></tr>
  </tbody></table>

  <h3>${t('Inputs &amp; labels','المدخلات والليبلات')}</h3>
  <p>${t('Always pair an <code>&lt;input&gt;</code> with a <code>&lt;label&gt;</code>. Match the label’s <code>for</code> to the input’s <code>id</code> so clicking the label focuses the field.','دايمًا اربط <code>&lt;input&gt;</code> بـ <code>&lt;label&gt;</code>. خلّي <code>for</code> بتاعة الليبل = <code>id</code> بتاعة الإنبوت علشان لما تدوس على الليبل يبقى الفوكس على الخانة.')}</p>
  ${codeBlock('','<label for="email">Email</label>\n<input type="email" id="email" name="email" required>')}

  <h4>${t('Key &lt;input&gt; attributes','أهم خصائص &lt;input&gt;')}</h4>
  <table class="ref"><thead><tr><th>${t('Attribute','الخاصية')}</th><th>${t('What it does','بتعمل إيه')}</th><th>${t('Example','مثال')}</th></tr></thead><tbody>
    <tr><td><code>type</code></td><td>${t('The kind of field: text, email, checkbox, and more','نوع الخانة: text أو email أو checkbox وغيرهم')}</td><td><code>type="email"</code></td></tr>
    <tr><td><code>name</code></td><td>${t('The key sent with the value (needed to submit)','المفتاح اللي بيتبعت مع القيمة (لازم للإرسال)')}</td><td><code>name="email"</code></td></tr>
    <tr><td><code>value</code></td><td>${t('The current or default value','القيمة الحالية أو الافتراضية')}</td><td><code>value="hi"</code></td></tr>
    <tr><td><code>placeholder</code></td><td>${t('Hint text inside an empty field','نص تلميح جوّه الخانة الفاضية')}</td><td><code>placeholder="Your name"</code></td></tr>
    <tr><td><code>required</code></td><td>${t('Must be filled before submitting','لازم تتملي قبل الإرسال')}</td><td><code>required</code></td></tr>
    <tr><td><code>disabled</code></td><td>${t('Turns the field off','بتقفل الخانة')}</td><td><code>disabled</code></td></tr>
    <tr><td><code>readonly</code></td><td>${t('Value can be seen but not edited','القيمة تتشاف بس ماتتعدّلش')}</td><td><code>readonly</code></td></tr>
    <tr><td><code>min</code>/<code>max</code>/<code>step</code></td><td>${t('Limits for number and date inputs','حدود لمدخلات الأرقام والتواريخ')}</td><td><code>min="1"</code></td></tr>
    <tr><td><code>maxlength</code></td><td>${t('Maximum number of characters','أقصى عدد حروف')}</td><td><code>maxlength="50"</code></td></tr>
    <tr><td><code>checked</code></td><td>${t('Pre-selects a checkbox or radio','بيختار الـ checkbox أو radio مقدمًا')}</td><td><code>checked</code></td></tr>
  </tbody></table>

  <h4>${t('Common input types','أنواع مدخلات شائعة')}</h4>
  <table class="ref"><thead><tr><th>type</th><th>${t('Use','الاستخدام')}</th></tr></thead><tbody>
    <tr><td><code>text</code></td><td>${t('Single-line text','نص سطر واحد')}</td></tr>
    <tr><td><code>email</code>/<code>tel</code>/<code>url</code></td><td>${t('Validated formats + mobile keyboards','صيغ متحقّق منها + كيبورد مناسب')}</td></tr>
    <tr><td><code>password</code></td><td>${t('Hidden characters','حروف مخفية')}</td></tr>
    <tr><td><code>number</code>/<code>date</code></td><td>${t('Numbers and dates','أرقام وتواريخ')}</td></tr>
    <tr><td><code>checkbox</code>/<code>radio</code></td><td>${t('Multiple / single choice','اختيار متعدد / واحد')}</td></tr>
    <tr><td><code>file</code></td><td>${t('Upload a file','رفع ملف')}</td></tr>
  </tbody></table>

  <h3>${t('Other controls','عناصر تانية')}</h3>
  <ul class="doc">
    <li><code>&lt;textarea&gt;</code> — ${t('multi-line text.','نص متعدد الأسطر.')}</li>
    <li><code>&lt;select&gt;</code> + <code>&lt;option&gt;</code> — ${t('a dropdown menu.','قائمة منسدلة.')}</li>
    <li><code>&lt;button type="submit"&gt;</code> — ${t('sends the form.','بيبعت الفورم.')}</li>
  </ul>

  <div class="callout tip"><span class="ic"><i class="fa-solid fa-lightbulb"></i></span><div>${t('Add <code>required</code>, <code>placeholder</code>, and correct <code>type</code> to get free browser validation and better mobile keyboards.','زوّد <code>required</code> و<code>placeholder</code> و<code>type</code> صح علشان تاخد تحقق مجاني من المتصفح وكيبورد أحسن على الموبايل.')}</div></div>

  <h3>${t('Try it live','جرّب بنفسك')}</h3>
  ${play(`<form>\n  <p>\n    <label for="name">Name</label><br>\n    <input type="text" id="name" placeholder="Your name" required>\n  </p>\n  <p>\n    <label for="fav">Favorite topic</label><br>\n    <select id="fav">\n      <option>Tables</option>\n      <option>Forms</option>\n      <option>Semantics</option>\n    </select>\n  </p>\n  <p><label><input type="checkbox"> Subscribe</label></p>\n  <button type="submit">Send</button>\n</form>`)}

  <div class="exercise">
    <span class="etag"><i class="fa-solid fa-screwdriver-wrench"></i> ${t('Exercise 10','تمرين 10')}</span>
    <h4>${t('Build a contact form','ابني فورم تواصل')}</h4>
    <p class="goal">${t('Create a form with: a text input for name, an email input (required), a dropdown of 3 subjects, a textarea for the message, and a submit button. Label every field correctly.','اعمل فورم فيه: إنبوت نص للاسم، إنبوت إيميل (required)، قائمة بـ 3 مواضيع، textarea للرسالة، وزر إرسال. واربط ليبل لكل خانة صح.')}</p>
    <ul class="checklist">
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Every input has a matching label','كل إنبوت ليه ليبل مطابق')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Email is required','الإيميل required')}</li>
      <li><i class="fa-solid fa-star fa-check-star"></i> ${t('Includes select + textarea + submit','فيه select + textarea + submit')}</li>
    </ul>
  </div>

  ${quiz(t('What connects a <code>&lt;label&gt;</code> to its input?','إيه اللي بيربط <code>&lt;label&gt;</code> بالإنبوت بتاعتها؟'), [t('The name attribute','خاصية name'),t("The label's <code>for</code> matching the input's <code>id</code>",'خاصية <code>for</code> بتطابق <code>id</code> الإنبوت'),t('They must be adjacent','لازم يكونوا جنب بعض'),t('The type attribute','خاصية type')], 1, t("Set the label's for to the same value as the input's id to link them.","خلّي for بتاعة الليبل = id بتاعة الإنبوت علشان يتربطوا."))}
  ${quiz(t('Which input type gives free email-format validation?','أنهي نوع إنبوت بيدي تحقق مجاني من صيغة الإيميل؟'), ['type="text"','type="email"','type="string"','type="mail"'], 1, t('type="email" validates the format and shows an email keyboard on mobile.','type="email" بيتحقق من الصيغة وبيظهر كيبورد إيميل على الموبايل.'))}
`});

L.push({ id:'final', icon:'fa-solid fa-star',
  nav:{en:'✓ Final review', ar:'✓ المراجعة النهائية'},
  section:{en:'Finish', ar:'النهاية'},
  body:()=>`
  <span class="kicker">${t('Wrap-up','ختام')}</span>
  <h2 class="title"><span class="tico"><i class="fa-solid fa-star"></i></span> ${t('Final review','المراجعة النهائية')}</h2>
  <p class="lead">${t('You made it through all ten topics. Let’s lock it in with a cheat-sheet and a mixed quiz.','خلّصت العشر مواضيع كلها. يلا نثبّتها بملخص وكويز متنوّع.')}</p>

  <h3>${t('Cheat sheet','ورقة ملخص')}</h3>
  <table class="ref"><thead><tr><th>${t('Topic','الموضوع')}</th><th>${t('Remember','افتكر')}</th></tr></thead><tbody>
    <tr><td>${t('Structure','التركيب')}</td><td>doctype → html → head + body</td></tr>
    <tr><td>${t('Tags','التاجات')}</td><td>${t('opening + content + closing; attributes in the open tag','فتح + محتوى + قفل؛ الخصائص في تاج الفتح')}</td></tr>
    <tr><td>${t('Semantic','الدلالة')}</td><td>${t('header/nav/main/article/footer over div soup','header/nav/main/article/footer أحسن من حساء div')}</td></tr>
    <tr><td>${t('Headings','العناوين')}</td><td>${t('one h1; never skip levels','h1 واحد؛ ماتنطّش مستويات')}</td></tr>
    <tr><td>${t('Text','النص')}</td><td>strong/em ${t('for meaning','للمعنى')}</td></tr>
    <tr><td>${t('Lists','اللوائم')}</td><td>ul / ol / dl</td></tr>
    <tr><td>${t('Links','الروابط')}</td><td>${t('a + href; meaningful text','a + href؛ نص ليه معنى')}</td></tr>
    <tr><td>${t('Media','الوسائط')}</td><td>img + alt; audio/video + controls</td></tr>
    <tr><td>${t('Tables','الجداول')}</td><td>table/tr/th/td; ${t('data only','للبيانات بس')}</td></tr>
    <tr><td>${t('Forms','الفورمات')}</td><td>${t('label + input; correct type','label + input؛ type صح')}</td></tr>
  </tbody></table>

  <h3>${t('Mixed quiz','كويز متنوّع')}</h3>
  ${quiz(t('Which is the correct heading order?','أنهي ترتيب عناوين صحيح؟'), ['h1 → h3 → h2','h1 → h2 → h3','h2 → h1 → h2','h3 → h2 → h1'], 1, t('Go in order without skipping: h1 then h2 then h3.','امشي بالترتيب من غير قفز: h1 ثم h2 then h3.'))}
  ${quiz(t('Pick the semantic element:','اختر العنصر الدالّ:'), ['&lt;div&gt;','&lt;span&gt;','&lt;article&gt;','&lt;b&gt;'], 2, t('&lt;article&gt; is semantic — it describes self-contained content.','&lt;article&gt; دالّ — بيوصف محتوى قائم بذاته.'))}
  ${quiz(t('Which correctly marks up a required email field?','أنهي واحد بيكتب خانة إيميل مطلوبة صح؟'), ['&lt;input type="text" email&gt;','&lt;input type="email" required&gt;','&lt;email required&gt;','&lt;input required="email"&gt;'], 1, t('Use type="email" with the boolean required attribute.','استخدم type="email" مع خاصية required.'))}
  ${quiz(t('Tables should be used for…','الجداول تستخدم لـ…'), [t('Page layout','تخطيط الصفحة'),t('Tabular data','بيانات جدولية'),t('Navigation menus','قوائم تنقل'),t('Image galleries','معارض صور')], 1, t('Tables are for genuine rows/columns of data — not layout.','الجداول للصفوف والأعمدة الحقيقية — مش للتخطيط.'))}

  <div class="callout tip"><span class="ic"><i class="fa-solid fa-graduation-cap"></i></span><div><strong>${t('Congratulations!','ألف مبروك!')}</strong> ${t('You now know the core building blocks of HTML. Next stop: styling it all with CSS.','دلوقتي عارف اللبنات الأساسية للـ HTML. المحطة الجاية: تنسيق كل ده بالـ CSS.')}</div></div>
`});

/* ================= ENGINE ================= */
const DONE_KEY='htmlfoundations.done.v1';
let done={};
try{ done=JSON.parse(localStorage.getItem(DONE_KEY)||'{}')||{}; }catch(e){ done={}; }
function saveDone(){ try{ localStorage.setItem(DONE_KEY, JSON.stringify(done)); }catch(e){} }
const trackables=L.filter(l=>l.track!==false);
let current='home';

function currentId(){ return (location.hash||'#home').replace('#',''); }

function buildNav(){
  const nav=document.getElementById('nav');
  let html=''; let lastSec=null;
  L.forEach(l=>{
    const sec=pick(l.section);
    if(sec!==lastSec){ html+=`<div class="navsec">${sec}</div>`; lastSec=sec; }
    const active=l.id===current?'active':'';
    const dn=done[l.id]?'done':'';
    const currentIcon=done[l.id]?'<i class="fa-solid fa-circle-check"></i>':`<i class="${l.icon}"></i>`;
    html+=`<a href="#${l.id}" class="${active} ${dn}"><span class="nx">${currentIcon}</span><span>${pick(l.nav)}</span></a>`;
  });
  nav.innerHTML=html;
}

function updateProgress(){
  const total=trackables.length;
  const n=trackables.filter(l=>done[l.id]).length;
  const fill=document.getElementById('pfill');
  const label=document.getElementById('plabel');
  if(fill) fill.style.width=(total?Math.round(n/total*100):0)+'%';
  if(label){ var star=n>=total?'🏆 ':'⭐ '; label.textContent=star+t(`${n} of ${total} lessons complete`,`خلصت ${n} من ${total} دروس`); }
}

function markDoneHtml(l){
  const d=done[l.id];
  const msg=d?t('Lesson completed — nice work!','الدرس اتقفل — تسلم إيدك!'):t('Finished this lesson?','خلصت الدرس ده؟');
  const btn=d?t('Mark as not done','رجعه لسه مخلصش'):t('Mark complete ✓','علمّه خلص ✓');
  return `<div class="mark-done"><span>${msg}</span><button class="btn primary" data-done="${l.id}"><i class="fa-solid fa-circle-check"></i> ${btn}</button></div>`;
}

function pagerHtml(l){
  const i=L.findIndex(x=>x.id===l.id);
  const prev=L[i-1], next=L[i+1];
  const pv=t('← Previous','السابق →');
  const nx=t('Next →','← التالي');
  const p=prev?`<a href="#${prev.id}"><div class="dir">${pv}</div><div class="ttl">${pick(prev.nav)}</div></a>`:`<a class="disabled"></a>`;
  const n=next?`<a class="next" href="#${next.id}"><div class="dir">${nx}</div><div class="ttl">${pick(next.nav)}</div></a>`:`<a class="next disabled"></a>`;
  return `<div class="pager">${p}${n}</div>`;
}

function route(){
  const id=currentId();
  const l=L.find(x=>x.id===id)||L[0];
  current=l.id;
  let html='<div class="page active">'+l.body()+BYLINE();
  if(l.track!==false) html+=markDoneHtml(l);
  html+=pagerHtml(l);
  html+='</div>';
  const c=document.getElementById('content');
  c.innerHTML=html;
  window.scrollTo(0,0);
  buildNav();
  updateProgress();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function handleQuiz(opt){
  const q=opt.closest('.quiz');
  if(q.dataset.answered) return;
  q.dataset.answered='1';
  const correct=parseInt(q.dataset.correct,10);
  const chosen=parseInt(opt.getAttribute('data-i'),10);
  const opts=Array.prototype.slice.call(q.querySelectorAll('.opt'));
  opts.forEach((o,i)=>{ o.disabled=true; if(i===correct) o.classList.add('correct'); if(i===chosen && chosen!==correct) o.classList.add('wrong'); });
  const fb=q.querySelector('.fb');
  const ok=chosen===correct;
  fb.classList.add('show', ok?'ok':'no');
  fb.innerHTML=(ok?t('✅ Correct! ','✅ صح! '):t('❌ Not quite. ','❌ مش ظبط. '))+q.dataset.why;
  if(ok) celebrate(t('You nailed it! 🎉', 'جميل جداً! 🎉'));
}

/* ---- celebrations, praise & copy helpers ---- */
const PRAISE=[['Great job! ','برافو عليك! '],['Awesome! ','تحفة! '],['You did it! ','عملتها! '],['Keep it up! ','كمّل كده! '],['Nice work! ','شغل جميل! ']];
const EMOJI_PRAISE=['🎉','⭐','🙌','🚀','👏'];
function pickPraise(){ var i=Math.floor(Math.random()*PRAISE.length); return t(PRAISE[i][0],PRAISE[i][1])+EMOJI_PRAISE[i]; }
function praiseFor(all){ return all ? t('All lessons complete! You are an HTML star! ','خلّصت كل الدروس! انت نجم HTML! ')+'🏆' : pickPraise(); }
function confetti(){ if(matchMedia('(prefers-reduced-motion:reduce)').matches) return; var box=document.createElement('div'); box.className='confetti'; var colors=['#3A86FF','#2CD182','#FFBE0B','#FF006E','#7c5cff','#ffce3d']; for(var i=0;i<60;i++){ var s=document.createElement('i'); s.style.left=(Math.random()*100)+'vw'; s.style.background=colors[i%colors.length]; s.style.animationDelay=(Math.random()*0.35)+'s'; s.style.transform='rotate('+(Math.random()*360)+'deg)'; s.style.position='absolute'; s.style.width='12px'; s.style.height='18px'; box.appendChild(s); } document.body.appendChild(box); setTimeout(function(){ box.remove(); },2500); }
function toast(msg){ var el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); requestAnimationFrame(function(){ el.classList.add('show'); }); setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); },320); },2300); }
function celebrate(msg){ confetti(); toast(msg); }

document.addEventListener('click', function(e){
  const run=e.target.closest('[data-run]');
  if(run){ const id=run.getAttribute('data-run'); const ta=document.getElementById(id); const out=document.getElementById(id+'-out'); if(ta&&out) out.srcdoc=ta.value; return; }
  const cp=e.target.closest('[data-copy]');
  if(cp){ var cbox=cp.closest('.code'); var codeEl=cbox?cbox.querySelector('code'):null; var txt=codeEl?codeEl.textContent:''; var fin=function(){ cp.innerHTML=`<i class="fa-solid fa-circle-check"></i> ${t('Copied!','اتنسخ!')}`; cp.classList.add('ok'); setTimeout(function(){ cp.innerHTML=`<i class="fa-solid fa-copy"></i> ${t('Copy','نسخ')}`; cp.classList.remove('ok'); },1400); }; try { navigator.clipboard.writeText(txt).then(fin,fin); } catch(err){ fin(); } return; }
  const opt=e.target.closest('.opt');
  if(opt){ handleQuiz(opt); return; }
  const dn=e.target.closest('[data-done]');
  if(dn){ const id=dn.getAttribute('data-done'); var wasDone=!!done[id]; done[id]=!done[id]; saveDone(); updateProgress(); route(); if(!wasDone && done[id]) celebrate(praiseFor(trackables.every(function(l){return done[l.id];}))); return; }
});

/* run all playgrounds once on render so previews are not blank */
function primePlaygrounds(){
  document.querySelectorAll('[data-run]').forEach(function(btn){
    const id=btn.getAttribute('data-run'); const ta=document.getElementById(id); const out=document.getElementById(id+'-out');
    if(ta&&out) out.srcdoc=ta.value;
  });
}

/* ---- Theme ---- */
const THEME_KEY='htmlfoundations.theme.v1';
const themeMq=matchMedia('(prefers-color-scheme:dark)');
function resolveTheme(pref){ return (pref==='dark'||(pref==='system'&&themeMq.matches))?'dark':'light'; }
function applyTheme(){
  const pref=localStorage.getItem(THEME_KEY)||'system';
  document.documentElement.dataset.theme=resolveTheme(pref);
  document.querySelectorAll('#themeToggle button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-theme-set')===pref); });
}
document.getElementById('themeToggle').addEventListener('click', function(e){
  const b=e.target.closest('[data-theme-set]'); if(!b) return;
  localStorage.setItem(THEME_KEY, b.getAttribute('data-theme-set')); applyTheme();
});
themeMq.addEventListener('change', function(){ if((localStorage.getItem(THEME_KEY)||'system')==='system') applyTheme(); });

/* ---- Language ---- */
function applyLang(){
  document.documentElement.lang = LANG==='ar'?'ar':'en';
  document.documentElement.dir = LANG==='ar'?'rtl':'ltr';
  const bs=document.querySelector('.brand p'); if(bs) bs.textContent=t('Interactive explainer','شرح تفاعلي');
  const set=function(sel,txt){ const el=document.querySelector(sel); if(el) el.innerHTML=txt; };
  set('[data-theme-set="light"]',`<i class="fa-solid fa-sun"></i> ${t('Light','فاتح')}`);
  set('[data-theme-set="dark"]',`<i class="fa-solid fa-moon"></i> ${t('Dark','غامق')}`);
  set('[data-theme-set="system"]',`<i class="fa-solid fa-circle-half-stroke"></i> ${t('Auto','تلقائي')}`);
  document.querySelectorAll('#langToggle button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang-set')===LANG); });
}
const langToggle=document.getElementById('langToggle');
if(langToggle) langToggle.addEventListener('click', function(e){
  const b=e.target.closest('[data-lang-set]'); if(!b) return;
  LANG=b.getAttribute('data-lang-set'); try{ localStorage.setItem(LANG_KEY, LANG); }catch(err){}
  applyLang(); route(); primePlaygrounds();
});

/* ---- Mobile menu ---- */
const menuBtn=document.getElementById('menuBtn'), sidebar=document.getElementById('sidebar'), backdrop=document.getElementById('backdrop');
menuBtn.addEventListener('click', function(){ sidebar.classList.toggle('open'); backdrop.classList.toggle('open'); });
backdrop.addEventListener('click', function(){ sidebar.classList.remove('open'); backdrop.classList.remove('open'); });

window.addEventListener('hashchange', function(){ route(); primePlaygrounds(); });

/* ---- Init ---- */
applyTheme();
applyLang();
route();
primePlaygrounds();
</script>
</body>
</html>
